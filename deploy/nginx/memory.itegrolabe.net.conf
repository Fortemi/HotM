# nginx configuration for memory.itegrolabe.net
# Install to: /etc/nginx/sites-available/memory.itegrolabe.net.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/memory.itegrolabe.net.conf /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx
#
# NOTE: If using integrolabs.net domain instead, update server_name and SSL cert paths

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name memory.itegrolabe.net;

    # SSL Configuration
    # NOTE: Update paths if using different domain or certificate
    # For integrolabs.net wildcard: /etc/nginx/ssl/integrolabs.net.crt
    ssl_certificate /etc/nginx/ssl/itegrolabe.net.crt;
    ssl_certificate_key /etc/nginx/ssl/itegrolabe.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (optional - uncomment after testing)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Logging
    access_log /var/log/nginx/memory.itegrolabe.net_access.log;
    error_log /var/log/nginx/memory.itegrolabe.net_error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MCP Server - exact match for /mcp (no trailing slash)
    location = /mcp {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # MCP Session ID for StreamableHTTP transport
        proxy_set_header MCP-Session-Id $http_mcp_session_id;
        proxy_pass_header MCP-Session-Id;

        # SSE support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # MCP Server - /mcp/ and subpaths
    location /mcp/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # MCP Session ID for StreamableHTTP transport
        proxy_set_header MCP-Session-Id $http_mcp_session_id;
        proxy_pass_header MCP-Session-Id;

        # SSE support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Fortemi API - proxy /api requests
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Streaming support (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # Large request bodies
        client_max_body_size 50M;
    }

    # React SPA - proxy to Docker container
    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for HMR in dev, can be removed in prod)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name memory.itegrolabe.net;
    return 301 https://$host$request_uri;
}
