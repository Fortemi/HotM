# Doc Site Build Validation
#
# Validates that the documentation site builds successfully when docs change.
# Catches broken links, bad config, and build errors before merge.
#
# Required Gitea secrets:
#   BAO_CI_ROLE_ID    — OpenBao AppRole role_id for this repo
#   BAO_CI_SECRET_ID  — OpenBao AppRole secret_id for this repo

name: Docsite Build

on:
  push:
    branches: [main]
    paths: ['docs/**']
  pull_request:
    branches: [main]
    paths: ['docs/**']

concurrency:
  group: docsite-build-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    container: node:20
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check for OpenBao bootstrap
        id: precheck
        env:
          BAO_CI_ROLE_ID: ${{ secrets.BAO_CI_ROLE_ID }}
          BAO_CI_SECRET_ID: ${{ secrets.BAO_CI_SECRET_ID }}
        run: |
          if [ -z "${BAO_CI_ROLE_ID:-}" ] || [ -z "${BAO_CI_SECRET_ID:-}" ]; then
            echo "::warning::OpenBao CI bootstrap is not provisioned; skipping docsite build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout HotM
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install OpenBao fetch dependencies
        if: steps.precheck.outputs.skip != 'true'
        run: apt-get update && apt-get install -y --no-install-recommends curl jq

      - name: Fetch dbbuilder clone token from OpenBao
        if: steps.precheck.outputs.skip != 'true'
        env:
          BAO_CI_ROLE_ID: ${{ secrets.BAO_CI_ROLE_ID }}
          BAO_CI_SECRET_ID: ${{ secrets.BAO_CI_SECRET_ID }}
        run: ci/openbao-fetch.sh --spec ci/openbao-fetch.docsite-build.spec

      - name: Clone dbbuilder
        if: steps.precheck.outputs.skip != 'true'
        run: |
          git clone "https://token:${GT_ACCESS_TOKEN}@git.integrolabs.net/roctinam/dbbuilder.git" /tmp/dbbuilder

      - name: Install dbbuilder dependencies
        if: steps.precheck.outputs.skip != 'true'
        working-directory: /tmp/dbbuilder/apps/publisher
        run: npm ci

      - name: Configure tenant
        if: steps.precheck.outputs.skip != 'true'
        run: |
          cat > /tmp/dbbuilder/apps/publisher/tenants.json <<'TENANTS'
          {
            "$schema": "./tenants.schema.json",
            "tenants": [
              {
                "id": "hotm-docs",
                "source": {
                  "type": "local",
                  "path": "${{ gitea.workspace }}/docs"
                },
                "domains": ["docs.fortemi.io"],
                "strictLinks": true
              }
            ]
          }
          TENANTS

      - name: Build doc site
        if: steps.precheck.outputs.skip != 'true'
        working-directory: /tmp/dbbuilder/apps/publisher
        run: node scripts/build-tenants.js hotm-docs

      - name: Verify build output
        if: steps.precheck.outputs.skip != 'true'
        run: |
          ls -la /tmp/dbbuilder/apps/publisher/dist/hotm-docs/
          test -f /tmp/dbbuilder/apps/publisher/dist/hotm-docs/index.html
          echo "Build successful"
