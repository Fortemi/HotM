# Desktop Build Matrix — HotM
#
# Rolling dev builds for macOS (DMG) and Linux (AppImage + deb).
# Triggers on push to main touching ui/** or this workflow file.
# Artifacts published to the "dev-latest" rolling prerelease on Gitea.
#
# macOS build: ubuntu-22.04 runner SSHes to mutsu (M4 Mac mini, 10.0.42.41)
# to produce a native aarch64 DMG. No act_runner on mac — SSH hybrid pattern.
#
# Prerequisite: VAULT_CI_ROLE_ID and VAULT_CI_SECRET_ID repo secrets set.
# The mutsu SSH key is fetched through the HotM vault CI role.
# Runner setup: .gitea/workflows/mutsu-verify.yml
#
# Tracking: Fortemi/HotM#181 (macOS), Fortemi/HotM#180 (Linux)

name: Desktop Build Matrix

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'release/sidecar-provenance.json'
      - 'scripts/download-pinned-sidecar.sh'
      - 'scripts/ci/mutsu-build-lock.sh'
      - '.gitea/workflows/desktop-build-matrix.yml'
  workflow_dispatch:

env:
  GITEA_API: https://git.integrolabs.net/api/v1/repos/${{ github.repository }}
  DEV_TAG: dev-latest

# ---------------------------------------------------------------------------
# Linux — AppImage + deb
# ---------------------------------------------------------------------------
jobs:
  build-linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH_URL="${REPO_URL/https:\/\//https:\/\/x-access-token:${GITHUB_TOKEN}@}"
          git init . && git remote add origin "${AUTH_URL}"
          git fetch --depth=1 origin "${GITHUB_SHA}" && git checkout --force FETCH_HEAD

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' \
            -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' \
            -e 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' \
            -e 's|http://us-east-1.ec2.archive.ubuntu.com|https://archive.ubuntu.com|g' \
            /etc/apt/sources.list

          # Mirror resilience: retry up to 3 times; on failure swap to a known-good archive
          apt_update_strict() {
            local tries=0
            until apt-get update -qq; do
              tries=$((tries + 1))
              if [ $tries -ge 3 ]; then
                echo "apt-get update failed after 3 tries — switching to archive.ubuntu.com"
                sed -i 's|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list || true
                sed -i 's|https://us-east-1.ec2.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list || true
                apt-get update -qq || true
                return
              fi
              echo "apt-get update failed (attempt ${tries}/3) — retrying in 5s"
              sleep 5
            done
          }

          apt_update_strict
          apt-get install -y --no-install-recommends \
            curl jq xdg-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev patchelf \
            libayatana-appindicator3-dev \
            build-essential pkg-config libssl-dev

      - name: Install Node.js 20
        shell: bash
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Install Rust stable
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --target x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Download pinned Fortemi sidecar (Linux x86_64)
        shell: bash
        run: |
          set -euo pipefail
          # Rename to hotm-namespaced filename so the Tauri-bundled sidecar
          # lands at /usr/bin/hotm-matric-api in the .deb (no collision with
          # sibling apps that bundle their own /usr/bin/matric-api). See #187.
          DEST="ui/src-tauri/binaries/hotm-matric-api-x86_64-unknown-linux-gnu"
          scripts/download-pinned-sidecar.sh x86_64-unknown-linux-gnu "${DEST}"
          echo "Sidecar ready: ${DEST} ($(du -h ${DEST} | cut -f1))"

      - name: Build Tauri app (Linux)
        working-directory: ui
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npx tauri build

      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' ui/src-tauri/tauri.conf.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Locate bundles (Tauri names vary slightly)
          APPIMAGE=$(find ui/src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          DEB=$(find ui/src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          echo "appimage=${APPIMAGE}" >> $GITHUB_OUTPUT
          echo "deb=${DEB}" >> $GITHUB_OUTPUT
          echo "AppImage: ${APPIMAGE}"
          echo "deb:      ${DEB}"

      - name: Publish AppImage to dev-latest
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_PATH="${{ steps.artifacts.outputs.appimage }}"
          ASSET_NAME=$(basename "$ASSET_PATH")
          VERSION="${{ steps.artifacts.outputs.version }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # Get or create dev-latest prerelease
          RESPONSE=$(curl -s -H "Authorization: token ${API_TOKEN}" \
            "${GITEA_API}/releases/tags/${DEV_TAG}")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${GITEA_API}/releases" \
              -d "$(jq -n \
                --arg tag "${DEV_TAG}" \
                --arg sha "${GITHUB_SHA}" \
                --arg body "Rolling dev build from main (${SHORT_SHA})" \
                '{tag_name: $tag, target_commitish: $sha,
                  name: "HotM Desktop (dev-latest)", body: $body,
                  draft: false, prerelease: true}')" \
              | jq -r '.id')
            echo "Created dev-latest release (id=${RELEASE_ID})"
          fi

          # Delete stale asset of same name
          STALE_ID=$(curl -s \
            -H "Authorization: token ${API_TOKEN}" \
            "${GITEA_API}/releases/${RELEASE_ID}/assets" \
            | jq -r ".[] | select(.name == \"${ASSET_NAME}\") | .id // empty")
          if [ -n "$STALE_ID" ]; then
            curl -s -X DELETE \
              -H "Authorization: token ${API_TOKEN}" \
              "${GITEA_API}/releases/${RELEASE_ID}/assets/${STALE_ID}"
            echo "Deleted stale asset: ${ASSET_NAME}"
          fi

          # Upload
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${API_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${ASSET_PATH}" \
            "${GITEA_API}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}")
          [ "$HTTP" = "201" ] && echo "Uploaded ${ASSET_NAME}" \
            || { echo "Upload failed (HTTP ${HTTP})"; exit 1; }

      - name: Publish deb to dev-latest
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_PATH="${{ steps.artifacts.outputs.deb }}"
          ASSET_NAME=$(basename "$ASSET_PATH")

          RELEASE_ID=$(curl -s -H "Authorization: token ${API_TOKEN}" \
            "${GITEA_API}/releases/tags/${DEV_TAG}" | jq -r '.id')

          STALE_ID=$(curl -s \
            -H "Authorization: token ${API_TOKEN}" \
            "${GITEA_API}/releases/${RELEASE_ID}/assets" \
            | jq -r ".[] | select(.name == \"${ASSET_NAME}\") | .id // empty")
          if [ -n "$STALE_ID" ]; then
            curl -s -X DELETE \
              -H "Authorization: token ${API_TOKEN}" \
              "${GITEA_API}/releases/${RELEASE_ID}/assets/${STALE_ID}"
          fi

          HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${API_TOKEN}" \
            -H "Content-Type: application/vnd.debian.binary-package" \
            --data-binary "@${ASSET_PATH}" \
            "${GITEA_API}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}")
          [ "$HTTP" = "201" ] && echo "Uploaded ${ASSET_NAME}" \
            || { echo "Upload failed (HTTP ${HTTP})"; exit 1; }

# ---------------------------------------------------------------------------
# macOS — DMG via SSH to mutsu
# ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS DMG (via mutsu)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout vault helper
        uses: actions/checkout@v4

      - name: Fetch mutsu SSH key from vault
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
          MUTSU_SSH_KEY_VAULT_PATH: ${{ vars.MUTSU_SSH_KEY_VAULT_PATH }}
          MUTSU_SSH_KEY_VAULT_FIELD: ${{ vars.MUTSU_SSH_KEY_VAULT_FIELD }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.mutsu.spec

      - name: Set up SSH to mutsu
        shell: bash
        run: |
          set -euo pipefail
          test -s "${MUTSU_SSH_KEY_FILE:?MUTSU_SSH_KEY_FILE is required}"
          mkdir -p ~/.ssh
          tr -d '\r' <"$MUTSU_SSH_KEY_FILE" >~/.ssh/mutsu_key
          chmod 600 ~/.ssh/mutsu_key
          ssh-keygen -y -f ~/.ssh/mutsu_key >/dev/null
          host_key="$(mktemp)"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -t ed25519 10.0.42.41 >"$host_key" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          test -s "$host_key"
          fingerprint="$(ssh-keygen -lf "$host_key" | awk '{print $2}')"
          test "$fingerprint" = "SHA256:5g0PgPko1v4soAco1TrwF7uLOMoctLuNKTwGt29PTFk"
          cat "$host_key" >~/.ssh/known_hosts
          rm -f "$host_key"
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host mutsu
            HostName 10.0.42.41
            User manitcor
            IdentityFile ~/.ssh/mutsu_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            PreferredAuthentications publickey
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connectivity
        shell: bash
        run: |
          ssh mutsu 'echo "SSH OK — $(uname -m) $(sw_vers -productVersion 2>/dev/null)"'

      - name: Clone repo on mutsu at current SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_DIR="/Volumes/build/hotm/builds/run-${GITHUB_RUN_ID}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH_URL="${REPO_URL/https:\/\//https:\/\/x-access-token:${GITHUB_TOKEN}@}"
          SHA="${GITHUB_SHA}"

          ssh mutsu bash -s -- "$BUILD_DIR" "$AUTH_URL" "$SHA" << 'REMOTE'
          set -euo pipefail
          BUILD_DIR="$1"
          AUTH_URL="$2"
          SHA="$3"
          mkdir -p "$BUILD_DIR"
          git init "$BUILD_DIR"
          cd "$BUILD_DIR"
          git remote add origin "$AUTH_URL"
          git fetch --depth=1 origin "$SHA"
          git checkout --force FETCH_HEAD
          echo "Cloned at ${SHA:0:7} → ${BUILD_DIR}"
          REMOTE

      - name: Build Tauri app on mutsu
        shell: bash
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_DIR="/Volumes/build/hotm/builds/run-${GITHUB_RUN_ID}"
          LOCK_HELPER="/Volumes/build/tmp/mutsu-build-lock-hotm-matrix-${GITHUB_RUN_ID}.sh"
          scp scripts/ci/mutsu-build-lock.sh "mutsu:${LOCK_HELPER}"

          ssh mutsu bash "$LOCK_HELPER" \
            --label "HotM-desktop-matrix-${GITHUB_RUN_ID}" \
            --timeout 3600 \
            -- bash -s -- "$BUILD_DIR" "$GITEA_TOKEN" << 'REMOTE'
          set -euo pipefail
          BUILD_DIR="$1"
          GITEA_TOKEN="$2"

          export PATH="/Volumes/build/bt6/cargo/bin:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          export CARGO_HOME="/Volumes/build/bt6/cargo"
          export RUSTUP_HOME="/Volumes/build/bt6/cargo/rustup"
          . /Volumes/build/bt6/cargo/env 2>/dev/null || true

          echo "=== Rust: $(cargo --version) ==="
          echo "=== Node: $(node --version) ==="
          echo "=== npm:  $(npm --version) ==="

          # Download pinned Fortemi sidecar (macOS aarch64) — rename to hotm-namespaced
          # filename so the Tauri-bundled sidecar lives inside the .app bundle
          # at MacOS/hotm-matric-api (no collision with sibling apps). See #187.
          DEST="${BUILD_DIR}/ui/src-tauri/binaries/hotm-matric-api-aarch64-apple-darwin"
          "${BUILD_DIR}/scripts/download-pinned-sidecar.sh" aarch64-apple-darwin "${DEST}"
          echo "Sidecar ready: ${DEST} ($(du -h ${DEST} | cut -f1))"

          cd "${BUILD_DIR}/ui"
          npm ci
          npx tauri build

          echo "=== Build complete ==="
          find "${BUILD_DIR}/ui/src-tauri/target/release/bundle" \
            -name "*.dmg" -o -name "*.app" 2>/dev/null | head -10
          REMOTE

      - name: Stage DMG from mutsu
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="/Volumes/build/hotm/builds/run-${GITHUB_RUN_ID}"

          ssh mutsu bash -s -- "$BUILD_DIR" << 'REMOTE'
          set -euo pipefail
          BUILD_DIR="$1"
          BUNDLE_DIR="${BUILD_DIR}/ui/src-tauri/target/release/bundle"

          DMG_SRC=$(find "${BUNDLE_DIR}/dmg" -name "*.dmg" | head -1)
          VERSION=$(python3 -c "import json; print(json.load(open('${BUILD_DIR}/ui/src-tauri/tauri.conf.json'))['version'])")
          DMG_OUT="${BUILD_DIR}/HotM_${VERSION}_aarch64.dmg"

          if [ -z "$DMG_SRC" ]; then
            echo "ERROR: no .dmg found in ${BUNDLE_DIR}/dmg"
            exit 1
          fi

          # Use the Tauri-produced DMG directly. Custom ad-hoc re-signing of the
          # bundle fails because matric-api (shipped from Fortemi CI) has dylib
          # references that fail codesign strict pre-sign validation on this host.
          # Tauri's bundler already handles signing during npx tauri build.
          cp "$DMG_SRC" "$DMG_OUT"
          echo "DMG ready: ${DMG_OUT} ($(du -h ${DMG_OUT} | cut -f1))"
          REMOTE

      - name: Collect DMG from mutsu
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="/Volumes/build/hotm/builds/run-${GITHUB_RUN_ID}"
          VERSION=$(curl -s \
            -H "Authorization: token ${{ github.token }}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/${GITHUB_SHA}/ui/src-tauri/tauri.conf.json" \
            2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
          # Fallback: get version from remote file path
          if [ -z "$VERSION" ]; then
            VERSION=$(ssh mutsu "python3 -c \"import json; print(json.load(open('/Volumes/build/hotm/builds/run-${GITHUB_RUN_ID}/ui/src-tauri/tauri.conf.json'))['version'])\"")
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          DMG_NAME="HotM_${VERSION}_aarch64.dmg"
          scp "mutsu:${BUILD_DIR}/${DMG_NAME}" "./${DMG_NAME}"
          echo "Collected: ${DMG_NAME} ($(du -h ${DMG_NAME} | cut -f1))"
          echo "DMG_NAME=${DMG_NAME}" >> $GITHUB_ENV

      - name: Publish DMG to dev-latest
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_NAME="${DMG_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # Get or create dev-latest prerelease
          RESPONSE=$(curl -s -H "Authorization: token ${API_TOKEN}" \
            "${GITEA_API}/releases/tags/${DEV_TAG}")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${GITEA_API}/releases" \
              -d "$(jq -n \
                --arg tag "${DEV_TAG}" \
                --arg sha "${GITHUB_SHA}" \
                --arg body "Rolling dev build from main (${SHORT_SHA})" \
                '{tag_name: $tag, target_commitish: $sha,
                  name: "HotM Desktop (dev-latest)", body: $body,
                  draft: false, prerelease: true}')" \
              | jq -r '.id')
            echo "Created dev-latest release (id=${RELEASE_ID})"
          fi

          # Delete stale asset of same name
          STALE_ID=$(curl -s \
            -H "Authorization: token ${API_TOKEN}" \
            "${GITEA_API}/releases/${RELEASE_ID}/assets" \
            | jq -r ".[] | select(.name == \"${ASSET_NAME}\") | .id // empty")
          if [ -n "$STALE_ID" ]; then
            curl -s -X DELETE \
              -H "Authorization: token ${API_TOKEN}" \
              "${GITEA_API}/releases/${RELEASE_ID}/assets/${STALE_ID}"
            echo "Deleted stale asset: ${ASSET_NAME}"
          fi

          HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${API_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${ASSET_NAME}" \
            "${GITEA_API}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}")
          [ "$HTTP" = "201" ] && echo "Uploaded ${ASSET_NAME} to dev-latest" \
            || { echo "Upload failed (HTTP ${HTTP})"; exit 1; }

      - name: Cleanup build dir on mutsu
        if: always()
        shell: bash
        run: |
          BUILD_DIR="/Volumes/build/hotm/builds/run-${GITHUB_RUN_ID}"
          LOCK_HELPER="/Volumes/build/tmp/mutsu-build-lock-hotm-matrix-${GITHUB_RUN_ID}.sh"
          ssh mutsu "rm -rf '${BUILD_DIR}'; rm -f '${LOCK_HELPER}'" && echo "Cleaned ${BUILD_DIR}" || true
          rm -f ~/.ssh/mutsu_key
          ci/vault-fetch.sh --cleanup
