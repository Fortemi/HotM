name: SDLC Gates

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  fortemi-route-inventory:
    name: Fortemi Route Inventory
    runs-on: ubuntu-latest
    env:
      FORTEMI_REPOSITORY: Fortemi/fortemi.git
    steps:
      - name: Checkout HotM
        shell: bash
        run: |
          set -euo pipefail
          PR_HEAD_REF="$(
            python3 - <<'PY'
          import json
          import os

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          if event_path:
              with open(event_path, encoding="utf-8") as event_file:
                  print(
                      json.load(event_file)
                      .get("pull_request", {})
                      .get("head", {})
                      .get("ref", "")
                  )
          PY
          )"
          FETCH_REF="${PR_HEAD_REF:-${GITHUB_REF:-${GITHUB_SHA:-main}}}"
          git init .
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${FETCH_REF}" ||
            git fetch --depth 1 origin "${GITHUB_SHA:-main}"
          git checkout --detach FETCH_HEAD

      - name: Checkout Fortemi sibling
        shell: bash
        run: |
          set -euo pipefail
          FORTEMI_COMMIT="$(
            python3 -c \
              'import json; print(json.load(open("release/sidecar-provenance.json"))["target_commitish"])'
          )"
          git clone "https://git.integrolabs.net/${FORTEMI_REPOSITORY}" ../fortemi
          git -C ../fortemi checkout --detach "${FORTEMI_COMMIT}"

      - name: Verify Fortemi route inventory
        shell: bash
        run: .aiwg/testing/scripts/verify-fortemi-route-inventory.sh

      - name: Install Node.js and npm
        shell: bash
        run: |
          apt-get update
          apt-get install --no-install-recommends -y nodejs npm

      - name: Verify Fortemi realtime event catalog
        shell: bash
        run: node .aiwg/testing/scripts/verify-fortemi-event-catalog.mjs

      - name: Verify Fortemi Knowledge Shard contract fixture
        shell: bash
        run: node .aiwg/testing/scripts/verify-fortemi-knowledge-shard-contract.mjs

      - name: Install OpenAPI verifier dependency
        shell: bash
        run: npm ci --prefix ui --ignore-scripts

      - name: Verify Fortemi OpenAPI consumer contract
        shell: bash
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)" \
            node .aiwg/testing/scripts/verify-fortemi-openapi-contract.mjs \
              ../fortemi \
              --write-ci-receipt openapi-consumer-receipt.json

      - name: Test delivered OpenAPI client boundary
        shell: bash
        run: npm --prefix ui test -- --run src/api/__tests__/calls.test.ts src/api/__tests__/delivered-openapi-contract.test.ts

      - name: Upload OpenAPI consumer receipt
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: fortemi-openapi-consumer-receipt
          path: openapi-consumer-receipt.json

      - name: Verify Fortemi closeout package
        shell: bash
        run: python3 .aiwg/testing/scripts/verify-fortemi-closeout-package.py

  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: node-20
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check PR template compliance
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const requiredSections = [
              '## Summary',
              '## Checklists',
              '### Security & Privacy',
              '## Testing Notes',
            ];
            const missing = requiredSections.filter(s => !body.includes(s));
            // Require at least one checked item in UI checklist
            const hasUiChecks = /### UI \(React SPA\)[\s\S]*- \[x\]/i.test(body);
            if (missing.length || !hasUiChecks) {
              core.setFailed(`PR template incomplete. Missing sections: ${missing.join(', ')}. Ensure at least one checklist is checked for UI (React SPA).`);
            }

      - name: Ensure codeowners reviewers requested
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviewers = pr.requested_reviewers?.map(r => r.login) || [];
            // Nudge only; GitHub auto-requests CODEOWNERS where possible
            if (reviewers.length === 0) {
              core.warning('No reviewers requested. Verify CODEOWNERS assignment.');
            }
