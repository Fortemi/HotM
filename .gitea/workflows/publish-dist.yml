# Publish HotM UI dist as a downloadable Gitea release tarball.
#
# - On push to main touching ui/: upsert rolling "hotm-latest" release
# - On v* tag: attach tarball to the versioned release
# - Manual trigger: upsert "hotm-latest"
#
# Downstream consumers download hotm-ui-dist.tar.gz from hotm-latest
# and extract it; env-config.js is injected post-extract by the consumer.
#
# Tracking: Fortemi/HotM#178, roctinam/devops#28

name: Publish UI Dist

on:
  push:
    branches: [main]
    paths: ['ui/**']
  create:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional versioned release tag to repair (for example v2026.7.1)'
        required: false

jobs:
  publish-dist:
    name: Build & Publish UI Dist
    runs-on: node-20
    steps:
      - name: Checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH_URL="${REPO_URL/https:\/\//https:\/\/x-access-token:${GITHUB_TOKEN}@}"
          git init . && git remote add origin "${AUTH_URL}"
          TARGET="${GITHUB_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" &&
            -n "${RELEASE_TAG_INPUT}" ]]; then
            TARGET="refs/tags/${RELEASE_TAG_INPUT}"
          fi
          git fetch --depth=1 origin "${TARGET}"
          git checkout --force FETCH_HEAD

      - name: Install system tools
        shell: bash
        run: |
          sed -i 's|http://deb.debian.org|https://deb.debian.org|g' \
            /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          apt-get install -y -qq curl jq

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Package dist
        run: |
          tar -czf hotm-ui-dist.tar.gz -C ui dist
          echo "Tarball contents (first 20):"
          { tar -tzf hotm-ui-dist.tar.gz || true; } | head -20 || true
          echo "Size: $(du -h hotm-ui-dist.tar.gz | cut -f1)"

      - name: Verify tarball structure
        run: |
          mkdir -p /tmp/verify-dist
          tar -xzf hotm-ui-dist.tar.gz -C /tmp/verify-dist
          if [ ! -d /tmp/verify-dist/dist ]; then
            echo "ERROR: tarball does not extract to dist/ directory"
            exit 1
          fi
          if [ ! -f /tmp/verify-dist/dist/index.html ]; then
            echo "ERROR: dist/index.html missing from tarball"
            exit 1
          fi
          if [ ! -f /tmp/verify-dist/dist/env-config.js ]; then
            echo "WARNING: env-config.js not found in dist/ — consumer must inject post-extract"
          fi
          echo "Tarball structure verified"
          rm -rf /tmp/verify-dist

      - name: Publish to rolling release (hotm-latest)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
        env:
          API_TOKEN: ${{ github.token }}
          API_BASE: https://git.integrolabs.net/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="hotm-latest"
          ASSET="hotm-ui-dist.tar.gz"

          # --- Delete existing release + tag if present ---
          EXISTING=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${API_TOKEN}" \
            "${API_BASE}/releases/tags/${TAG}")

          if [ "$EXISTING" = "200" ]; then
            # Get release ID and delete its assets first
            RELEASE_JSON=$(curl -s \
              -H "Authorization: token ${API_TOKEN}" \
              "${API_BASE}/releases/tags/${TAG}")
            RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')

            # Delete all existing assets
            ASSET_IDS=$(echo "$RELEASE_JSON" | jq -r '.assets[]?.id // empty')
            for AID in $ASSET_IDS; do
              curl -s -X DELETE \
                -H "Authorization: token ${API_TOKEN}" \
                "${API_BASE}/releases/${RELEASE_ID}/assets/${AID}"
            done

            # Delete the release
            curl -s -X DELETE \
              -H "Authorization: token ${API_TOKEN}" \
              "${API_BASE}/releases/${RELEASE_ID}"
            echo "Deleted existing release ${TAG} (id=${RELEASE_ID})"
          fi

          # Delete existing tag so we can recreate at HEAD
          curl -s -X DELETE \
            -H "Authorization: token ${API_TOKEN}" \
            "${API_BASE}/tags/${TAG}" || true

          # --- Create new release ---
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_BODY="Rolling build from main (${SHORT_SHA})\n\nExtract with: \`tar -xzf ${ASSET}\`\n\nProduces a \`dist/\` directory ready to serve."

          RESPONSE=$(curl -s -o /tmp/release_response.json -w '%{http_code}' -X POST \
            -H "Authorization: token ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API_BASE}/releases" \
            -d "$(jq -n \
              --arg tag "${TAG}" \
              --arg target "${GITHUB_SHA}" \
              --arg name "HotM UI Dist (latest)" \
              --arg body "Rolling build from main (${SHORT_SHA})\n\nExtract with: \`tar -xzf ${ASSET}\`\n\nProduces a \`dist/\` directory ready to serve." \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: false, prerelease: false}')")

          if [ "$RESPONSE" != "201" ]; then
            echo "Failed to create release (HTTP ${RESPONSE})"
            cat /tmp/release_response.json
            exit 1
          fi

          RELEASE_ID=$(jq -r '.id' /tmp/release_response.json)
          echo "Created release ${TAG} (id=${RELEASE_ID})"

          # --- Upload tarball asset ---
          UPLOAD_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${API_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${ASSET}" \
            "${API_BASE}/releases/${RELEASE_ID}/assets?name=${ASSET}")

          if [ "$UPLOAD_CODE" = "201" ]; then
            echo "Uploaded ${ASSET} to release ${TAG}"
          else
            echo "Failed to upload asset (HTTP ${UPLOAD_CODE})"
            exit 1
          fi

      - name: Attach to versioned release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          API_TOKEN: ${{ github.token }}
          API_BASE: https://git.integrolabs.net/api/v1/repos/${{ github.repository }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${RELEASE_TAG_INPUT}"
          fi
          ASSET="hotm-ui-dist.tar.gz"

          # Wait briefly for the release to be created by ui-ci.yml
          RELEASE_ID=""
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s \
              -H "Authorization: token ${API_TOKEN}" \
              "${API_BASE}/releases/tags/${TAG}")
            RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
            if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
              break
            fi
            echo "Release for ${TAG} not found yet, waiting... (attempt ${i}/5)"
            sleep 5
          done

          # If release doesn't exist yet, create it
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            VERSION="${TAG#v}"
            CREATE_CODE=$(curl -s -o /tmp/release_response.json -w '%{http_code}' -X POST \
              -H "Authorization: token ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${API_BASE}/releases" \
              -d "$(jq -n \
                --arg tag "${TAG}" \
                --arg name "HotM ${VERSION}" \
                --arg body "Release ${VERSION}" \
                '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')")

            if [ "$CREATE_CODE" = "201" ]; then
              RELEASE_ID=$(jq -r '.id' /tmp/release_response.json)
              echo "Created release ${TAG} (id=${RELEASE_ID})"
            elif [ "$CREATE_CODE" = "409" ] || [ "$CREATE_CODE" = "422" ]; then
              # Race condition: try fetching again
              RESPONSE=$(curl -s \
                -H "Authorization: token ${API_TOKEN}" \
                "${API_BASE}/releases/tags/${TAG}")
              RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
            else
              echo "Failed to create release (HTTP ${CREATE_CODE})"
              cat /tmp/release_response.json
              exit 1
            fi
          fi

          echo "Attaching ${ASSET} to release ${TAG} (id=${RELEASE_ID})"

          mapfile -t STALE_IDS < <(curl -fsSL \
            -H "Authorization: token ${API_TOKEN}" \
            "${API_BASE}/releases/${RELEASE_ID}/assets" |
            jq -r --arg name "${ASSET}" '.[] | select(.name == $name) | .id')
          for STALE in "${STALE_IDS[@]}"; do
            curl -fsSL -X DELETE \
              -H "Authorization: token ${API_TOKEN}" \
              "${API_BASE}/releases/${RELEASE_ID}/assets/${STALE}"
          done

          UPLOAD_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${API_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${ASSET}" \
            "${API_BASE}/releases/${RELEASE_ID}/assets?name=${ASSET}")

          if [ "$UPLOAD_CODE" = "201" ]; then
            echo "Uploaded ${ASSET} to release ${TAG}"
          else
            echo "Failed to upload asset (HTTP ${UPLOAD_CODE})"
            exit 1
          fi

      - name: Install GitHub CLI
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|http://deb.debian.org|https://deb.debian.org|g' \
            /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          apt-get install -y --no-install-recommends curl jq
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          apt-get install -y gh

      - name: Fetch GitHub release token from vault
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
          GH_PUBLISH_TOKEN_VAULT_PATH: ${{ vars.GH_PUBLISH_TOKEN_VAULT_PATH }}
          GH_PUBLISH_TOKEN_VAULT_FIELD: ${{ vars.GH_PUBLISH_TOKEN_VAULT_FIELD }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.github-release.spec

      - name: Mirror versioned release to GitHub
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GITEA_TOKEN: ${{ github.token }}
          GITEA_REPO: ${{ github.repository }}
          GITHUB_REPO: Fortemi/HotM
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${GH_PUBLISH_TOKEN:?GH_PUBLISH_TOKEN is required}"
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${RELEASE_TAG_INPUT}"
          fi
          tools/release/mirror-gitea-release-to-github.sh "${TAG}"
