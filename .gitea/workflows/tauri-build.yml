name: Tauri Desktop Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ui/src-tauri/**'
      - 'ui/src/**'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'release/sidecar-provenance.json'
      - 'scripts/download-pinned-sidecar.sh'
      - '.gitea/workflows/tauri-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ui/src-tauri/**'
      - 'ui/src/**'
      - 'ui/package.json'
      - 'release/sidecar-provenance.json'
      - 'scripts/download-pinned-sidecar.sh'
      - '.gitea/workflows/tauri-build.yml'
  workflow_dispatch:
    inputs:
      live_tauri_receipt:
        description: 'Run the real Tauri command path against a signed live Fortemi API'
        required: false
        default: 'false'
        type: boolean
      live_tauri_api_url:
        description: 'Fortemi API base URL ending in /api/v1'
        required: false
        default: 'http://localhost:3000/api/v1'
      live_tauri_source_memory:
        description: 'Clean source memory using the hotm_live_ prefix'
        required: false
        default: ''
      live_tauri_recovery_memory:
        description: 'Distinct clean recovery memory using the hotm_live_ prefix'
        required: false
        default: ''

jobs:
  build-tauri:
    # CI verification: Linux-only (only runner available on Gitea)
    # Cross-platform builds (Windows/macOS) run in release.yml on tag push
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH_REPO_URL="${REPO_URL/https:\/\//https:\/\/x-access-token:${GITHUB_TOKEN}@}"
          if [ ! -d .git ]; then
            git init .
          fi
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "${AUTH_REPO_URL}"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable \
                --target x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Linux dependencies
        run: |
          sed -i 's|http://deb.debian.org|https://deb.debian.org|g' \
            /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev xdg-utils \
            build-essential pkg-config libssl-dev \
            curl jq

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Run Tauri local file command-core receipt
        id: tauri_command_core
        shell: bash
        working-directory: ui/src-tauri
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p ../test-results/tauri-command-core-receipt
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          TAURI_CONFIG='{"bundle":{"externalBin":[]}}' \
            cargo test local_file_ -- --nocapture
          local_file_status=$?
          TAURI_CONFIG='{"bundle":{"externalBin":[]}}' \
            cargo test native_ -- --nocapture
          native_status=$?
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${local_file_status}" -eq 0 ] && [ "${native_status}" -eq 0 ]; then
            status=0
          else
            status=1
          fi

          node - "${status}" "${started_at}" "${finished_at}" \
            > ../test-results/tauri-command-core-receipt/receipt.json <<'NODE'
          const [status, startedAt, finishedAt] = process.argv.slice(2);
          const receipt = {
            receipt: 'hotm-tauri-local-file-command-core',
            issue: 'Fortemi/HotM#283',
            command: 'TAURI_CONFIG={"bundle":{"externalBin":[]}} cargo test local_file_ -- --nocapture && TAURI_CONFIG={"bundle":{"externalBin":[]}} cargo test native_ -- --nocapture',
            status: Number(status) === 0 ? 'passed' : 'failed',
            exit_code: Number(status),
            started_at: startedAt,
            finished_at: finishedAt,
            git: {
              repository: process.env.GITHUB_REPOSITORY || null,
              sha: process.env.GITHUB_SHA || null,
              ref: process.env.GITHUB_REF || null,
              run_id: process.env.GITHUB_RUN_ID || null,
            },
            scope: [
              'real temporary local file bytes',
              'Tauri upload command core',
              'local TUS-compatible HTTP server create and PATCH',
              'desktop TUS offset-conflict HEAD resume and resumed PATCH',
              'Tauri download command core',
              'local attachment download HTTP server',
              'Authorization and X-Fortemi-Memory headers on upload and download',
              'upload metadata and final attachment JSON',
              'progress events',
              'download variant route',
              'saved filesystem bytes, byte count, reopened byte count, and SHA-256 digest',
              'selected native file paths are converted to local file metadata',
              'native download core writes, reopens, and hashes saved attachment bytes',
            ],
            not_claimed: [
              'Tauri desktop GUI launch',
              'interactive native picker/save dialog operated in a launched GUI',
              'real Fortemi backend',
              'trusted publisher allowlist',
            ],
          };
          console.log(JSON.stringify(receipt, null, 2));
          NODE

          (cd .. && npm run verify:tauri-command-core-receipt)
          (cd .. && npm run verify:desktop-live-asset-receipt)
          cp ../../.aiwg/evidence/hotm-desktop-live-asset-receipt-2026-07-27.json \
            ../test-results/tauri-command-core-receipt/desktop-live-asset-receipt.json
          node ../scripts/write-receipt-artifact-manifest.cjs \
            ../test-results/tauri-command-core-receipt/artifact-manifest.json \
            hotm-tauri-command-core-receipt \
            ../test-results/tauri-command-core-receipt
          node ../scripts/write-receipt-artifact-manifest.cjs --verify \
            ../test-results/tauri-command-core-receipt/artifact-manifest.json

          exit "${status}"

      - name: Upload Tauri command-core receipt
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: hotm-tauri-command-core-receipt
          path: ui/test-results/tauri-command-core-receipt/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run live Tauri signed full-v1 recovery receipt
        if: github.event_name == 'workflow_dispatch' && inputs.live_tauri_receipt == 'true'
        shell: bash
        working-directory: ui/src-tauri
        env:
          HOTM_LIVE_TAURI_API_URL: ${{ inputs.live_tauri_api_url }}
          HOTM_LIVE_TAURI_SOURCE_MEMORY: ${{ inputs.live_tauri_source_memory }}
          HOTM_LIVE_TAURI_RECOVERY_MEMORY: ${{ inputs.live_tauri_recovery_memory }}
          HOTM_LIVE_TAURI_API_TOKEN: ${{ secrets.HOTM_LIVE_ASSET_TOKEN }}
          HOTM_LIVE_TAURI_RECEIPT_PATH: ../test-results/live-tauri-full-v1-receipt/receipt.json
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ -z "${HOTM_LIVE_TAURI_SOURCE_MEMORY}" ] \
            || [ -z "${HOTM_LIVE_TAURI_RECOVERY_MEMORY}" ]; then
            echo "both live Tauri memory inputs are required" >&2
            exit 2
          fi
          mkdir -p ../test-results/live-tauri-full-v1-receipt
          TAURI_CONFIG='{"bundle":{"externalBin":[]}}' \
            cargo test \
              tests::live_fortemi_tauri_local_file_full_v1_recovery_receipt \
              -- --ignored --exact --nocapture
          (cd .. && npm run verify:live-tauri-full-v1-receipt -- \
            test-results/live-tauri-full-v1-receipt/receipt.json) \
            > ../test-results/live-tauri-full-v1-receipt/validation.json
          node ../scripts/write-receipt-artifact-manifest.cjs \
            ../test-results/live-tauri-full-v1-receipt/artifact-manifest.json \
            hotm-live-tauri-full-v1-recovery-receipt \
            ../test-results/live-tauri-full-v1-receipt
          node ../scripts/write-receipt-artifact-manifest.cjs --verify \
            ../test-results/live-tauri-full-v1-receipt/artifact-manifest.json

      - name: Upload live Tauri signed full-v1 recovery receipt
        if: always() && github.event_name == 'workflow_dispatch' && inputs.live_tauri_receipt == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: hotm-live-tauri-full-v1-recovery-receipt
          path: ui/test-results/live-tauri-full-v1-receipt/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Download pinned Fortemi sidecar (Linux x86_64)
        shell: bash
        run: |
          set -euo pipefail
          # Upstream binary keeps the canonical "matric-api" name; we rename
          # it to "hotm-matric-api" at stage time so the bundled sidecar lands
          # at /usr/bin/hotm-matric-api in the .deb (no /usr/bin/matric-api
          # collision with sibling Tauri apps that also bundle matric-api).
          # See issue #187.
          DEST="ui/src-tauri/binaries/hotm-matric-api-x86_64-unknown-linux-gnu"
          scripts/download-pinned-sidecar.sh x86_64-unknown-linux-gnu "${DEST}"
          echo "Sidecar ready: ${DEST} ($(du -h ${DEST} | cut -f1))"

      - name: Build Tauri app
        env:
          CARGO_BUILD_JOBS: "8"
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd ui
          npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: tauri-linux
          path: |
            ui/src-tauri/target/release/bundle/**/*.deb
            ui/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
