name: Tauri Desktop Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ui/src-tauri/**'
      - 'ui/src/**'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'release/sidecar-provenance.json'
      - 'scripts/download-pinned-sidecar.sh'
      - '.gitea/workflows/tauri-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ui/src-tauri/**'
      - 'ui/src/**'
      - 'ui/package.json'
      - 'release/sidecar-provenance.json'
      - 'scripts/download-pinned-sidecar.sh'
      - '.gitea/workflows/tauri-build.yml'
  workflow_dispatch:

jobs:
  build-tauri:
    # CI verification: Linux-only (only runner available on Gitea)
    # Cross-platform builds (Windows/macOS) run in release.yml on tag push
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH_REPO_URL="${REPO_URL/https:\/\//https:\/\/x-access-token:${GITHUB_TOKEN}@}"
          if [ ! -d .git ]; then
            git init .
          fi
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "${AUTH_REPO_URL}"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Linux dependencies
        run: |
          sed -i 's|http://deb.debian.org|https://deb.debian.org|g' \
            /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev xdg-utils \
            build-essential pkg-config libssl-dev \
            curl jq

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Download pinned Fortemi sidecar (Linux x86_64)
        shell: bash
        run: |
          set -euo pipefail
          # Upstream binary keeps the canonical "matric-api" name; we rename
          # it to "hotm-matric-api" at stage time so the bundled sidecar lands
          # at /usr/bin/hotm-matric-api in the .deb (no /usr/bin/matric-api
          # collision with sibling Tauri apps that also bundle matric-api).
          # See issue #187.
          DEST="ui/src-tauri/binaries/hotm-matric-api-x86_64-unknown-linux-gnu"
          scripts/download-pinned-sidecar.sh x86_64-unknown-linux-gnu "${DEST}"
          echo "Sidecar ready: ${DEST} ($(du -h ${DEST} | cut -f1))"

      - name: Build Tauri app
        env:
          CARGO_BUILD_JOBS: "8"
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd ui
          npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: tauri-linux
          path: |
            ui/src-tauri/target/release/bundle/**/*.deb
            ui/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
