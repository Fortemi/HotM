# Doc Site Deploy
#
# Builds and deploys the HotM documentation site on new release tags.
# Deploys to docs.fortemi.com/hotm/ — a subpath of the canonical Fortémi docs domain.
#
# Required Gitea secrets:
#   VAULT_CI_ROLE_ID   — vault AppRole role_id for this repo
#   VAULT_CI_SECRET_ID — vault AppRole secret_id for this repo
#
# Required Gitea variables:
#   DOCSITE_DEPLOY_HOST — docs server hostname
#   DOCSITE_DEPLOY_PORT — docs server SSH port
#   DOCSITE_DEPLOY_USER — deploy user on the docs server
#   DOCSITE_DEPLOY_PATH — absolute path on the docs server (with trailing slash)
#                         The HotM docs land at ${DOCSITE_DEPLOY_PATH}hotm/

name: Docsite Deploy

on:
  push:
    tags: ['v*']

concurrency:
  group: docsite-deploy
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    container: node:20
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check for vault bootstrap
        id: precheck
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: |
          if [ -z "${VAULT_CI_ROLE_ID:-}" ] || [ -z "${VAULT_CI_SECRET_ID:-}" ]; then
            echo "::warning::vault CI bootstrap is not provisioned; skipping docsite deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout HotM
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install deployment tools
        if: steps.precheck.outputs.skip != 'true'
        run: |
          sed -i 's|http://deb.debian.org|https://deb.debian.org|g' \
            /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends curl jq openssh-client rsync

      - name: Fetch docsite secrets from vault
        if: steps.precheck.outputs.skip != 'true'
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
          GT_ACCESS_TOKEN_VAULT_PATH: ${{ vars.GT_ACCESS_TOKEN_VAULT_PATH }}
          GT_ACCESS_TOKEN_VAULT_FIELD: ${{ vars.GT_ACCESS_TOKEN_VAULT_FIELD }}
          DEPLOY_SSH_KEY_VAULT_PATH: ${{ vars.DEPLOY_SSH_KEY_VAULT_PATH }}
          DEPLOY_SSH_KEY_VAULT_FIELD: ${{ vars.DEPLOY_SSH_KEY_VAULT_FIELD }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.docsite-deploy.spec

      - name: Validate deploy configuration
        if: steps.precheck.outputs.skip != 'true'
        env:
          DOCSITE_DEPLOY_HOST: ${{ vars.DOCSITE_DEPLOY_HOST }}
          DOCSITE_DEPLOY_PORT: ${{ vars.DOCSITE_DEPLOY_PORT }}
          DOCSITE_DEPLOY_USER: ${{ vars.DOCSITE_DEPLOY_USER }}
          DOCSITE_DEPLOY_PATH: ${{ vars.DOCSITE_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in DOCSITE_DEPLOY_HOST DOCSITE_DEPLOY_PORT DOCSITE_DEPLOY_USER DOCSITE_DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "$name Gitea variable is required" >&2
              exit 1
            fi
          done

      - name: Clone dbbuilder
        if: steps.precheck.outputs.skip != 'true'
        run: |
          git clone "https://token:${GT_ACCESS_TOKEN}@git.integrolabs.net/roctinam/dbbuilder.git" /tmp/dbbuilder

      - name: Install dbbuilder dependencies
        if: steps.precheck.outputs.skip != 'true'
        working-directory: /tmp/dbbuilder/apps/publisher
        run: npm ci

      - name: Configure tenant
        if: steps.precheck.outputs.skip != 'true'
        run: |
          cat > /tmp/dbbuilder/apps/publisher/tenants.json <<'TENANTS'
          {
            "$schema": "./tenants.schema.json",
            "tenants": [
              {
                "id": "hotm-docs",
                "source": {
                  "type": "local",
                  "path": "${{ gitea.workspace }}/docs"
                },
                "domains": ["docs.fortemi.com"],
                "strictLinks": false
              }
            ]
          }
          TENANTS

      - name: Build doc site
        if: steps.precheck.outputs.skip != 'true'
        working-directory: /tmp/dbbuilder/apps/publisher
        run: node scripts/build-tenants.js hotm-docs

      - name: Verify build output
        if: steps.precheck.outputs.skip != 'true'
        run: |
          test -d /tmp/dbbuilder/apps/publisher/dist/hotm-docs || { echo "Missing build output directory"; exit 1; }
          test -f /tmp/dbbuilder/apps/publisher/dist/hotm-docs/index.html || { echo "Missing index.html"; exit 1; }
          echo "Build verification passed"
          ls -lah /tmp/dbbuilder/apps/publisher/dist/hotm-docs/

      - name: Configure SSH key
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          test -s "${DEPLOY_SSH_KEY_FILE:?DEPLOY_SSH_KEY_FILE is required}"
          mkdir -p ~/.ssh
          cp "$DEPLOY_SSH_KEY_FILE" ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to docs server (subpath /hotm)
        if: steps.precheck.outputs.skip != 'true'
        env:
          DOCSITE_DEPLOY_HOST: ${{ vars.DOCSITE_DEPLOY_HOST }}
          DOCSITE_DEPLOY_PORT: ${{ vars.DOCSITE_DEPLOY_PORT }}
          DOCSITE_DEPLOY_USER: ${{ vars.DOCSITE_DEPLOY_USER }}
          DOCSITE_DEPLOY_PATH: ${{ vars.DOCSITE_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DOCSITE_DEPLOY_PATH="${DOCSITE_DEPLOY_PATH%/}/"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${DOCSITE_DEPLOY_PORT} -o StrictHostKeyChecking=accept-new" \
            /tmp/dbbuilder/apps/publisher/dist/hotm-docs/ \
            "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}:${DOCSITE_DEPLOY_PATH}hotm/"

      - name: Verify deployment
        if: steps.precheck.outputs.skip != 'true'
        env:
          DOCSITE_DEPLOY_HOST: ${{ vars.DOCSITE_DEPLOY_HOST }}
          DOCSITE_DEPLOY_PORT: ${{ vars.DOCSITE_DEPLOY_PORT }}
          DOCSITE_DEPLOY_USER: ${{ vars.DOCSITE_DEPLOY_USER }}
          DOCSITE_DEPLOY_PATH: ${{ vars.DOCSITE_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DOCSITE_DEPLOY_PATH="${DOCSITE_DEPLOY_PATH%/}/"
          ssh -i ~/.ssh/deploy_key -p "$DOCSITE_DEPLOY_PORT" -o StrictHostKeyChecking=accept-new \
            "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}" \
            "test -f '${DOCSITE_DEPLOY_PATH}hotm/index.html' && echo 'Deploy verified: index.html present' || { echo 'Deploy failed: index.html missing'; exit 1; }"

      - name: Cleanup SSH key
        if: always() && steps.precheck.outputs.skip != 'true'
        run: |
          rm -f ~/.ssh/deploy_key
          ci/vault-fetch.sh --cleanup

      - name: Log deployment result
        if: success() && steps.precheck.outputs.skip != 'true'
        run: |
          echo "Deployed docs.fortemi.com/hotm/"
          echo "Tag: ${{ gitea.ref }}"
          echo "Commit: ${{ gitea.sha }}"
