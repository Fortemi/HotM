name: Live Asset Browser and Tauri Receipt

on:
  push:
    branches: [main]
    paths:
      - 'ui/e2e/live/**'
      - 'ui/e2e/fixtures/live-api-helpers.ts'
      - 'ui/src/api/backup.ts'
      - 'ui/src-tauri/src/lib.rs'
      - 'ui/scripts/verify-live-asset-*.cjs'
      - 'ui/scripts/verify-live-asset-*.test.js'
      - 'release/live-asset-receipt-sidecar-provenance.json'
      - 'scripts/ci/run-live-asset-receipt.sh'
      - '.gitea/workflows/live-asset-receipt.yml'
  workflow_dispatch: {}

jobs:
  live-asset-receipt:
    name: Authenticated Headless Browser and Tauri Receipt
    runs-on: matric-builder
    timeout-minutes: 60
    steps:
      - name: Checkout HotM
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin \
            "https://git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --no-tags --depth 1 origin "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Install frontend and browser dependencies
        working-directory: ui
        run: |
          command -v node
          command -v npm
          command -v cargo
          command -v docker
          npm ci
          npx playwright install chromium --with-deps

      - name: Install Tauri dependencies
        shell: bash
        run: |
          run_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo "$@"
            fi
          }
          run_root apt-get update
          run_root apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev \
            build-essential pkg-config libssl-dev curl jq

      - name: Run isolated authenticated live receipt
        shell: bash
        env:
          CI: "true"
          HOTM_LIVE_EXPECT_CLEAN: "1"
        run: scripts/ci/run-live-asset-receipt.sh

      - name: Upload immutable live receipt
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: hotm-live-asset-ci-receipt
          path: ui/test-results/live-asset-ci-receipt/*.json
          if-no-files-found: error
          retention-days: 30
