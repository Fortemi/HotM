name: Release Mirror Provenance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag; defaults to the latest versioned Gitea release
        required: false
        type: string
  schedule:
    - cron: '23 9 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/release/mirror-gitea-release-to-github.sh'
      - 'tools/release/verify-release-mirror.sh'
      - '.gitea/workflows/release-mirror-verify.yml'

jobs:
  verify:
    name: Verify exact tag and assets
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA:-HEAD}"

      - name: Verify current release mirror
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="$(
              curl -fsSL \
                'https://git.integrolabs.net/api/v1/repos/Fortemi/HotM/releases?limit=100' |
                jq -er '
                  first(
                    .[]
                    | select(.draft == false)
                    | .tag_name
                    | select(
                        test("^v[0-9]+\\.[0-9]+\\.[0-9]+([.-][A-Za-z0-9.]+)?$")
                      )
                  )
                '
            )"
          fi
          tools/release/verify-release-mirror.sh "$tag"
