# Release Pipeline (Gitea Actions)
#
# Triggered on version tags. Runs on Gitea act_runner with Docker access.
# Publishes to both Gitea and GitHub registries, creates releases on both.
#
# Pipeline:
#   1. Quality Gate - typecheck, tests, coverage
#   2. Build SPA - production tarball
#   3. Build & Push Docker - Gitea registry + GHCR
#   4. Build Tauri - Linux desktop installer
#   5. Create Gitea Release
#   6. Publish to GitHub - push to GHCR + create GitHub Release

name: Release

on:
  # NOTE: Gitea Actions requires 'create' for tag triggers (not push.tags)
  create:
    tags: ['v*']
  workflow_dispatch:

env:
  GITEA_REGISTRY: git.integrolabs.net
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: fortemi/hotm-ui
  FORTEMI_API_URL: https://memory.integrolabs.net

jobs:
  # ─── Gate: typecheck, tests, coverage, audit ────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git .
          git checkout ${GITHUB_SHA:-HEAD}

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type check
        working-directory: ui
        run: npm run typecheck

      - name: Run tests with coverage
        working-directory: ui
        run: npm run test:coverage -- --run

      - name: Security audit (non-blocking)
        working-directory: ui
        run: npm audit --audit-level high || true

  # ─── Build: SPA tarball ─────────────────────────────────────────────
  build-spa:
    name: Build SPA
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    needs: quality-gate
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git .
          git checkout ${GITHUB_SHA:-HEAD}

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build React SPA
        working-directory: ui
        run: npm run build

      - name: Create production tarball
        run: |
          tar -czf /tmp/hotm-spa.tar.gz -C ui/dist .
          echo "SPA tarball created: $(ls -lh /tmp/hotm-spa.tar.gz)"

      - name: Stash SPA artifact
        run: |
          mkdir -p /opt/release-artifacts
          cp /tmp/hotm-spa.tar.gz /opt/release-artifacts/
          echo "Stashed to /opt/release-artifacts/"

  # ─── Build: Docker image → Gitea + GHCR ────────────────────────────
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git .
          git checkout ${GITHUB_SHA:-HEAD}

      - name: Log in to registries
        run: |
          echo "${{ secrets.BUILD_REPO_TOKEN }}" | docker login ${GITEA_REGISTRY} -u ${{ gitea.actor }} --password-stdin
          echo "${{ secrets.GH_PUBLISH_TOKEN }}" | docker login ${GHCR_REGISTRY} -u fortemi --password-stdin

      - name: Extract version from tag
        run: |
          TAG_NAME=${GITHUB_REF_NAME#v}

          if [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            CHANNEL="${BASH_REMATCH[2]}"
          elif [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="$TAG_NAME"
            CHANNEL="stable"
          else
            echo "Error: Invalid tag format. Expected v0.0.0 or v0.0.0-channel"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "Release version: $VERSION (channel: $CHANNEL)"

      - name: Build Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"

          docker build \
            -f ui/Dockerfile \
            --build-arg VITE_API_BASE_URL="${FORTEMI_API_URL}" \
            --build-arg VITE_GIT_SHA="${SHORT_SHA}" \
            -t "hotm-ui:build" \
            ui

          # Tag for Gitea internal registry
          GITEA_IMAGE="${GITEA_REGISTRY}/${IMAGE_NAME}"
          docker tag "hotm-ui:build" "${GITEA_IMAGE}:${VERSION}"
          docker tag "hotm-ui:build" "${GITEA_IMAGE}:latest"
          docker tag "hotm-ui:build" "${GITEA_IMAGE}:sha-${SHORT_SHA}"

          # Tag for GHCR public registry
          GHCR_IMAGE="${GHCR_REGISTRY}/${IMAGE_NAME}"
          docker tag "hotm-ui:build" "${GHCR_IMAGE}:${VERSION}"
          docker tag "hotm-ui:build" "${GHCR_IMAGE}:latest"
          docker tag "hotm-ui:build" "${GHCR_IMAGE}:sha-${SHORT_SHA}"

      - name: Push images
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"

          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Pushing ${image} (attempt ${attempt}/${max_attempts})"
              if docker push "${image}"; then
                return 0
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "Failed to push ${image} after ${max_attempts} attempts"
            return 1
          }

          # Push to Gitea internal registry
          GITEA_IMAGE="${GITEA_REGISTRY}/${IMAGE_NAME}"
          echo "Pushing to Gitea Registry..."
          push_with_retry "${GITEA_IMAGE}:${VERSION}"
          push_with_retry "${GITEA_IMAGE}:latest"
          push_with_retry "${GITEA_IMAGE}:sha-${SHORT_SHA}"

          # Push to GitHub Container Registry
          GHCR_IMAGE="${GHCR_REGISTRY}/${IMAGE_NAME}"
          echo "Pushing to GitHub Container Registry..."
          push_with_retry "${GHCR_IMAGE}:${VERSION}"
          push_with_retry "${GHCR_IMAGE}:latest"
          push_with_retry "${GHCR_IMAGE}:sha-${SHORT_SHA}"

          echo "Published images:"
          echo "  Gitea:  ${GITEA_IMAGE}:${VERSION}, :latest, :sha-${SHORT_SHA}"
          echo "  GitHub: ${GHCR_IMAGE}:${VERSION}, :latest, :sha-${SHORT_SHA}"

  # ─── Build: Tauri desktop installer (Linux) ──────────────────────────
  build-tauri:
    name: Build Tauri (Linux)
    runs-on: ubuntu-latest
    needs: quality-gate
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git .
          git checkout ${GITHUB_SHA:-HEAD}

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Linux dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev xdg-utils \
            build-essential pkg-config libssl-dev

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Tauri app
        env:
          CARGO_BUILD_JOBS: "8"
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd ui
          npx tauri build

      - name: Stash Tauri artifacts
        run: |
          mkdir -p /opt/release-artifacts/tauri
          find ui/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} /opt/release-artifacts/tauri/ \; 2>/dev/null || true
          echo "Tauri artifacts:"
          ls -lh /opt/release-artifacts/tauri/ 2>/dev/null || echo "  (none)"

  # ─── Release: Gitea Release ────────────────────────────────────────
  create-release:
    name: Create Gitea Release
    runs-on: ubuntu-latest
    needs: [build-spa, build-docker]
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git .
          git checkout ${GITHUB_SHA:-HEAD}

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          elif [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
            CHANNEL="${BASH_REMATCH[2]}"
            VERSION="${BASH_REMATCH[1]}"
          fi
          echo "CHANNEL=${CHANNEL:-stable}" >> $GITHUB_ENV
          DISPLAY_VERSION="${VERSION}$([ "${CHANNEL:-stable}" != "stable" ] && echo "-$CHANNEL" || true)"
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV

      - name: Create Gitea release
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.BUILD_REPO_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://git.integrolabs.net/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{
              \"tag_name\": \"${GITHUB_REF_NAME}\",
              \"name\": \"HotM ${DISPLAY_VERSION}\",
              \"body\": \"Release ${DISPLAY_VERSION}\nChannel: ${CHANNEL}\",
              \"draft\": false,
              \"prerelease\": $([ \"$CHANNEL\" != \"stable\" ] && echo true || echo false)
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "201" ]; then
            echo "Gitea Release created"
          elif [ "$HTTP_CODE" = "409" ] || [ "$HTTP_CODE" = "422" ]; then
            echo "Release may already exist"
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          else
            echo "Failed to create Gitea release (HTTP ${HTTP_CODE})"
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
            exit 1
          fi

  # ─── GitHub: Create GitHub Release ─────────────────────────────────
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-spa, build-docker]
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git .
          git checkout ${GITHUB_SHA:-HEAD}

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          elif [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
            CHANNEL="${BASH_REMATCH[2]}"
            VERSION="${BASH_REMATCH[1]}"
          fi
          echo "CHANNEL=${CHANNEL:-stable}" >> $GITHUB_ENV
          DISPLAY_VERSION="${VERSION}$([ "${CHANNEL:-stable}" != "stable" ] && echo "-$CHANNEL" || true)"
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV

      - name: Push tag to GitHub
        run: |
          git remote add github https://x-access-token:${{ secrets.GH_PUBLISH_TOKEN }}@github.com/Fortemi/HotM.git || true
          git push github "${GITHUB_REF_NAME}" --force 2>/dev/null || echo "Tag may already exist on GitHub"

      - name: Create GitHub Release
        run: |
          cat > /tmp/release_notes.md <<EOF
          ## HotM ${DISPLAY_VERSION}

          **Release Channel**: ${CHANNEL}

          ### Docker Images

          | Registry | Pull Command |
          |----------|-------------|
          | GHCR (public) | \`docker pull ghcr.io/${IMAGE_NAME}:${VERSION}\` |
          | Gitea (internal) | \`docker pull git.integrolabs.net/${IMAGE_NAME}:${VERSION}\` |

          ### Desktop Installer (Linux)

          | Format | Description |
          |--------|-------------|
          | \`.deb\` | Debian/Ubuntu package |
          | \`.AppImage\` | Portable Linux binary |

          ### SPA Bundle

          Download \`hotm-spa.tar.gz\` below - extract and serve with any static host.

          ### System Requirements

          - **Web**: Modern browser + network access to Fortemi API
          - **Desktop**: Linux x86_64 (Ubuntu 22.04+, or any distro via AppImage)
          - **Docker**: Any host running Docker Engine 20+
          EOF
          # Strip leading indentation
          sed -i 's/^          //' /tmp/release_notes.md

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GH_PUBLISH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Fortemi/HotM/releases" \
            -d "{
              \"tag_name\": \"${GITHUB_REF_NAME}\",
              \"name\": \"HotM ${DISPLAY_VERSION}\",
              \"body\": $(jq -Rs . /tmp/release_notes.md),
              \"draft\": false,
              \"prerelease\": $([ \"$CHANNEL\" != \"stable\" ] && echo true || echo false),
              \"generate_release_notes\": false
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "201" ]; then
            RELEASE_URL=$(echo "$BODY" | jq -r '.html_url')
            echo "GitHub Release created: ${RELEASE_URL}"
          elif [ "$HTTP_CODE" = "422" ]; then
            echo "Release may already exist on GitHub"
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          else
            echo "Failed to create GitHub release (HTTP ${HTTP_CODE})"
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
            exit 1
          fi
