# Publish HotM container images
#
# Publishes the backwards-compatible UI-only image and the supported all-in-one
# HotM + Fortemi bundle to GHCR and the Gitea registry:
#   - ghcr.io/fortemi/hotm-ui
#   - ghcr.io/fortemi/hotm-bundle
#   - git.integrolabs.net/fortemi/hotm-ui
#   - git.integrolabs.net/fortemi/hotm-bundle
#
# Tags:
#   main push → :latest + :sha-<7char>
#   v* tag    → :latest + :<version>  (e.g. :2026.2.0)
#
# Gitea secrets required:
#   VAULT_CI_ROLE_ID    — vault AppRole role_id for this repo
#   VAULT_CI_SECRET_ID  — vault AppRole secret_id for this repo
#
# Supported local bundle: publish 4180 (UI), 3000 (API), and optionally 3001
# (MCP) on loopback. POSTGRES_PASSWORD is required.
#
# Tracking: Fortemi/HotM#179

name: Publish HotM Container Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push container images
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH_URL="${REPO_URL/https:\/\//https:\/\/x-access-token:${GITHUB_TOKEN}@}"
          git init . && git remote add origin "${AUTH_URL}"
          git fetch --depth=1 origin "${GITHUB_SHA}" && git checkout --force FETCH_HEAD

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl jq

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          GHCR_UI="ghcr.io/fortemi/hotm-ui"
          GITEA_UI="git.integrolabs.net/fortemi/hotm-ui"
          GHCR_BUNDLE="ghcr.io/fortemi/hotm-bundle"
          GITEA_BUNDLE="git.integrolabs.net/fortemi/hotm-bundle"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            UI_TAGS="${GHCR_UI}:latest,${GHCR_UI}:${VERSION},${GITEA_UI}:latest,${GITEA_UI}:${VERSION}"
            BUNDLE_TAGS="${GHCR_BUNDLE}:latest,${GHCR_BUNDLE}:${VERSION},${GITEA_BUNDLE}:latest,${GITEA_BUNDLE}:${VERSION}"
            echo "mode=release  version=${VERSION}"
          else
            UI_TAGS="${GHCR_UI}:latest,${GHCR_UI}:sha-${SHORT_SHA},${GITEA_UI}:latest,${GITEA_UI}:sha-${SHORT_SHA}"
            BUNDLE_TAGS="${GHCR_BUNDLE}:latest,${GHCR_BUNDLE}:sha-${SHORT_SHA},${GITEA_BUNDLE}:latest,${GITEA_BUNDLE}:sha-${SHORT_SHA}"
            VERSION="${SHORT_SHA}"
            echo "mode=rolling  sha=${SHORT_SHA}"
          fi

          echo "ui_tags=${UI_TAGS}" >> "$GITHUB_OUTPUT"
          echo "bundle_tags=${BUNDLE_TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Set up Docker buildx
        shell: bash
        run: |
          docker buildx create --use --name hotm-builder 2>/dev/null || true

      - name: Fetch registry tokens from vault
        shell: bash
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
          GH_PUBLISH_TOKEN_VAULT_PATH: ${{ vars.GH_PUBLISH_TOKEN_VAULT_PATH }}
          GH_PUBLISH_TOKEN_VAULT_FIELD: ${{ vars.GH_PUBLISH_TOKEN_VAULT_FIELD }}
          BUILD_REPO_TOKEN_VAULT_PATH: ${{ vars.BUILD_REPO_TOKEN_VAULT_PATH }}
          BUILD_REPO_TOKEN_VAULT_FIELD: ${{ vars.BUILD_REPO_TOKEN_VAULT_FIELD }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.registry.spec

      - name: Log in to GHCR
        shell: bash
        run: |
          printf '%s\n' "${GH_PUBLISH_TOKEN:?GH_PUBLISH_TOKEN is required}" | docker login ghcr.io -u fortemi --password-stdin

      - name: Log in to Gitea registry
        shell: bash
        run: |
          printf '%s\n' "${BUILD_REPO_TOKEN:?BUILD_REPO_TOKEN is required}" | docker login git.integrolabs.net -u ${{ gitea.actor }} --password-stdin

      - name: Build and push legacy UI image
        shell: bash
        run: |
          set -euo pipefail
          TAGS="${{ steps.tags.outputs.ui_tags }}"
          VERSION="${{ steps.tags.outputs.version }}"
          BUILD_DATE="${{ steps.tags.outputs.build_date }}"

          # Build --tag args from comma-separated list
          TAG_ARGS=""
          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for t in "${TAG_LIST[@]}"; do
            TAG_ARGS="$TAG_ARGS --tag $t"
          done

          docker buildx build \
            --platform linux/amd64 \
            --file docker/ui/Dockerfile \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --build-arg "VERSION=${VERSION}" \
            ${TAG_ARGS} \
            --metadata-file /tmp/hotm-ui-image-metadata.json \
            --push \
            .

          echo "=== Pushed legacy UI images ==="
          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for t in "${TAG_LIST[@]}"; do echo "  ${t}"; done

      - name: Build and push HotM bundle image
        shell: bash
        run: |
          set -euo pipefail
          TAGS="${{ steps.tags.outputs.bundle_tags }}"
          VERSION="${{ steps.tags.outputs.version }}"
          BUILD_DATE="${{ steps.tags.outputs.build_date }}"

          TAG_ARGS=""
          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for t in "${TAG_LIST[@]}"; do
            TAG_ARGS="$TAG_ARGS --tag $t"
          done

          docker buildx build \
            --platform linux/amd64 \
            --file docker/bundle/Dockerfile \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --build-arg "VERSION=${VERSION}" \
            ${TAG_ARGS} \
            --metadata-file /tmp/hotm-bundle-image-metadata.json \
            --push \
            .

          echo "=== Pushed bundled images ==="
          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for t in "${TAG_LIST[@]}"; do echo "  ${t}"; done

      - name: Write image publication receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg schemaVersion "hotm.container-publication-receipt.v1" \
            --arg commit "${GITHUB_SHA}" \
            --arg version "${{ steps.tags.outputs.version }}" \
            --arg uiTags "${{ steps.tags.outputs.ui_tags }}" \
            --arg bundleTags "${{ steps.tags.outputs.bundle_tags }}" \
            --arg uiDigest "$(jq -r '."containerimage.digest"' /tmp/hotm-ui-image-metadata.json)" \
            --arg bundleDigest "$(jq -r '."containerimage.digest"' /tmp/hotm-bundle-image-metadata.json)" \
            --arg fortemiRevision "c93742d7c75b481621b821f4584304289eb364d5" \
            --arg fortemiImage "ghcr.io/fortemi/fortemi@sha256:7d014c5580e62526069a0fc0d7ad994ed70fa73a8810d2b07476b1dfe5a99ae4" \
            '{
              schemaVersion: $schemaVersion,
              commit: $commit,
              version: $version,
              ui: { tags: ($uiTags | split(",")), digest: $uiDigest },
              bundle: {
                tags: ($bundleTags | split(",")),
                digest: $bundleDigest,
                fortemiRevision: $fortemiRevision,
                fortemiImage: $fortemiImage
              }
            }' > hotm-container-publication-receipt.json
          jq . hotm-container-publication-receipt.json

      - name: Upload image publication receipt
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: hotm-container-publication-receipt
          path: hotm-container-publication-receipt.json
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          echo ""
          echo "============================================"
          echo "  HotM container images published"
          echo "============================================"
          echo "  SHA:     ${GITHUB_SHA:0:7}"
          echo "  Version: ${{ steps.tags.outputs.version }}"
          echo ""
          echo "Run with:"
          echo "  docker run --env-file .env \\"
          echo "    -p 127.0.0.1:4180:4180 -p 127.0.0.1:3000:3000 \\"
          echo "    ghcr.io/fortemi/hotm-bundle:latest"
