# CI/CD Pipeline for HotM React SPA
#
# Single workflow handles both CI and release, following Fortemi ci-builder pattern.
# Conditional jobs based on trigger type:
#   - Always: quality checks
#   - On push to main: publish dev image to Gitea registry
#   - On tag v*: build SPA + Docker + Tauri, publish to Gitea + GHCR, create releases
#
# NOTE: Gitea Actions requires 'create' block for tag triggers

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ui/**'
      - '.gitea/workflows/ui-ci.yml'
  create:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - '.gitea/workflows/ui-ci.yml'
  workflow_dispatch:

env:
  GITEA_REGISTRY: git.integrolabs.net
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: fortemi/hotm-ui
  FORTEMI_API_URL: https://memory.integrolabs.net

jobs:
  # ─── Always: Quality Gate ──────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git .
          git checkout ${GITHUB_SHA:-HEAD}

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type check
        working-directory: ui
        run: npm run typecheck

      - name: Run tests with coverage
        working-directory: ui
        run: npm run test:coverage -- --run

      - name: Run realtime convergence suite
        working-directory: ui
        run: npm run test:realtime

      - name: Security audit (non-blocking)
        working-directory: ui
        run: npm audit --audit-level high || true

      - name: Generate SBOM
        working-directory: ui
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json

  # ─── On push: Publish dev image to Gitea internal registry ─────────
  publish-dev:
    name: Publish Dev Image (Gitea)
    runs-on: titan
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git .
          git checkout ${GITHUB_SHA:-HEAD}

      - name: Log in to Gitea registry
        run: echo "${{ secrets.BUILD_REPO_TOKEN }}" | docker login ${GITEA_REGISTRY} -u ${{ gitea.actor }} --password-stdin

      - name: Build and push dev image
        run: |
          IMAGE="${GITEA_REGISTRY}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Pushing ${image} (attempt ${attempt}/${max_attempts})"
              if docker push "${image}"; then
                return 0
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "Failed to push ${image} after ${max_attempts} attempts"
            return 1
          }

          docker build \
            -f ui/Dockerfile \
            --build-arg VITE_API_BASE_URL="${FORTEMI_API_URL}" \
            --build-arg VITE_GIT_SHA="${SHORT_SHA}" \
            -t "${IMAGE}:main" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${SHORT_SHA}" \
            ui

          push_with_retry "${IMAGE}:main"
          push_with_retry "${IMAGE}:latest"
          push_with_retry "${IMAGE}:sha-${SHORT_SHA}"

  # =============================================================================
  # Release Jobs (tag push only)
  # =============================================================================

  # ─── Publish Release Docker Images → Gitea + GHCR ──────────────────
  publish-release:
    name: Publish Release Image
    runs-on: titan
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git .
          git checkout ${GITHUB_SHA:-HEAD}

      - name: Log in to registries
        run: |
          echo "${{ secrets.BUILD_REPO_TOKEN }}" | docker login ${GITEA_REGISTRY} -u ${{ gitea.actor }} --password-stdin
          echo "${{ secrets.GH_PUBLISH_TOKEN }}" | docker login ${GHCR_REGISTRY} -u fortemi --password-stdin

      - name: Build and push release images
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Pushing ${image} (attempt ${attempt}/${max_attempts})"
              if docker push "${image}"; then
                return 0
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "Failed to push ${image} after ${max_attempts} attempts"
            return 1
          }

          echo "Building release images for version: ${VERSION}"

          docker build \
            -f ui/Dockerfile \
            --build-arg VITE_API_BASE_URL="${FORTEMI_API_URL}" \
            --build-arg VITE_GIT_SHA="${SHORT_SHA}" \
            -t "hotm-ui:build" \
            ui

          # Tag and push to Gitea
          GITEA_IMAGE="${GITEA_REGISTRY}/${IMAGE_NAME}"
          docker tag "hotm-ui:build" "${GITEA_IMAGE}:${VERSION}"
          docker tag "hotm-ui:build" "${GITEA_IMAGE}:latest"
          docker tag "hotm-ui:build" "${GITEA_IMAGE}:sha-${SHORT_SHA}"

          push_with_retry "${GITEA_IMAGE}:${VERSION}"
          push_with_retry "${GITEA_IMAGE}:latest"
          push_with_retry "${GITEA_IMAGE}:sha-${SHORT_SHA}"

          # Tag and push to GHCR
          GHCR_IMAGE="${GHCR_REGISTRY}/${IMAGE_NAME}"
          docker tag "hotm-ui:build" "${GHCR_IMAGE}:${VERSION}"
          docker tag "hotm-ui:build" "${GHCR_IMAGE}:latest"
          docker tag "hotm-ui:build" "${GHCR_IMAGE}:sha-${SHORT_SHA}"

          push_with_retry "${GHCR_IMAGE}:${VERSION}"
          push_with_retry "${GHCR_IMAGE}:latest"
          push_with_retry "${GHCR_IMAGE}:sha-${SHORT_SHA}"

          echo "Published release images:"
          echo "  Gitea:  ${GITEA_IMAGE}:${VERSION}, :latest, :sha-${SHORT_SHA}"
          echo "  GitHub: ${GHCR_IMAGE}:${VERSION}, :latest, :sha-${SHORT_SHA}"

  # ─── Create Gitea Release ──────────────────────────────────────────
  create-release:
    name: Create Gitea Release
    runs-on: titan
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create release
        run: |
          VERSION="${GITHUB_REF_NAME}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.BUILD_REPO_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://git.integrolabs.net/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{
              \"tag_name\": \"${VERSION}\",
              \"name\": \"HotM ${VERSION}\",
              \"body\": \"Release ${VERSION}\",
              \"draft\": false,
              \"prerelease\": false
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "201" ]; then
            echo "Gitea Release created"
          elif [ "$HTTP_CODE" = "409" ] || [ "$HTTP_CODE" = "422" ]; then
            echo "Release may already exist"
          else
            echo "Failed to create Gitea release (HTTP ${HTTP_CODE})"
            echo "$BODY"
            exit 1
          fi

  # ─── Create GitHub Release with SPA + Tauri assets ─────────────────
  # Rebuilds SPA and Tauri independently (Fortemi pattern: each job builds its own)
  create-github-release:
    name: Create GitHub Release
    runs-on: titan
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git .
          git checkout ${GITHUB_SHA:-HEAD}

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Linux dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev xdg-utils \
            build-essential pkg-config libssl-dev jq

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build SPA tarball
        run: |
          cd ui && npm run build && cd ..
          tar -czf /tmp/hotm-spa.tar.gz -C ui/dist .
          echo "SPA tarball: $(ls -lh /tmp/hotm-spa.tar.gz)"

      - name: Build Tauri installers
        env:
          CARGO_BUILD_JOBS: "8"
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd ui
          npx tauri build

      - name: Collect release assets
        run: |
          mkdir -p /tmp/release-assets
          cp /tmp/hotm-spa.tar.gz /tmp/release-assets/
          find ui/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} /tmp/release-assets/ \; 2>/dev/null || true
          echo "Release assets:"
          ls -lh /tmp/release-assets/

      - name: Push tag to GitHub
        run: |
          git remote add github https://x-access-token:${{ secrets.GH_PUBLISH_TOKEN }}@github.com/Fortemi/HotM.git || true
          git push github "${GITHUB_REF_NAME}" --force 2>/dev/null || echo "Tag may already exist on GitHub"

      - name: Create GitHub Release and upload assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GITEA_REG="${GITEA_REGISTRY}"
          GHCR_REG="${GHCR_REGISTRY}"
          IMG="${IMAGE_NAME}"

          RELEASE_BODY="## HotM ${VERSION}

          ### Docker Images

          | Registry | Pull Command |
          |----------|-------------|
          | GHCR (public) | \`docker pull ${GHCR_REG}/${IMG}:${VERSION}\` |
          | Gitea (internal) | \`docker pull ${GITEA_REG}/${IMG}:${VERSION}\` |

          ### Desktop Installer (Linux)

          | Format | Description |
          |--------|-------------|
          | \`.deb\` | Debian/Ubuntu package |
          | \`.AppImage\` | Portable Linux binary |

          ### SPA Bundle

          Download \`hotm-spa.tar.gz\` below - extract and serve with any static host.

          ### System Requirements

          - **Web**: Modern browser + network access to Fortemi API
          - **Desktop**: Linux x86_64 (Ubuntu 22.04+, or any distro via AppImage)
          - **Docker**: Any host running Docker Engine 20+"

          # Build JSON body safely using jq --arg (handles all escaping)
          JSON_BODY=$(jq -n \
            --arg tag_name "${GITHUB_REF_NAME}" \
            --arg name "HotM ${VERSION}" \
            --arg body "${RELEASE_BODY}" \
            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: false, generate_release_notes: false}')

          # Create the release
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GH_PUBLISH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Fortemi/HotM/releases" \
            -d "${JSON_BODY}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "201" ]; then
            RELEASE_ID=$(echo "$BODY" | jq -r '.id')
            RELEASE_URL=$(echo "$BODY" | jq -r '.html_url')
            echo "GitHub Release created: ${RELEASE_URL}"
          elif [ "$HTTP_CODE" = "422" ]; then
            echo "Release may already exist, fetching existing..."
            RELEASE_ID=$(curl -s \
              -H "Authorization: token ${{ secrets.GH_PUBLISH_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Fortemi/HotM/releases/tags/${GITHUB_REF_NAME}" | jq -r '.id')
          else
            echo "Failed to create GitHub release (HTTP ${HTTP_CODE})"
            echo "$BODY"
            exit 1
          fi

          # Upload release assets
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            for asset in /tmp/release-assets/*; do
              FILENAME=$(basename "$asset")
              CONTENT_TYPE="application/octet-stream"
              case "$FILENAME" in
                *.tar.gz) CONTENT_TYPE="application/gzip" ;;
                *.deb)    CONTENT_TYPE="application/vnd.debian.binary-package" ;;
              esac

              echo "Uploading ${FILENAME}..."
              UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                -H "Authorization: token ${{ secrets.GH_PUBLISH_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: ${CONTENT_TYPE}" \
                --data-binary "@${asset}" \
                "https://uploads.github.com/repos/Fortemi/HotM/releases/${RELEASE_ID}/assets?name=${FILENAME}")

              UPLOAD_CODE=$(echo "$UPLOAD_RESPONSE" | tail -n1)
              if [ "$UPLOAD_CODE" = "201" ]; then
                echo "  Uploaded ${FILENAME}"
              else
                echo "  Failed to upload ${FILENAME} (HTTP ${UPLOAD_CODE})"
              fi
            done
          fi
