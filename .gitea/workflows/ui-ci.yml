# CI/CD Pipeline for HotM
#
# Responsibilities:
#   - Always: quality gates for ui/ and agent-proxy/ (parallel)
#   - On push to main / manual dispatch: publish agent-proxy dev image to Gitea + GHCR
#   - On tag v*: publish agent-proxy release image to Gitea + GHCR
#
# Out of scope (handled by dedicated workflows):
#   - HotM UI Docker image   → publish-hotm-ui-image.yml
#   - Desktop builds (Tauri) → desktop-build-matrix.yml (rolling), desktop-release.yml (tags)
#   - Gitea/GitHub releases  → desktop-release.yml
#
# NOTE: Gitea Actions requires 'create' block for tag triggers

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ui/**'
      - 'agent-proxy/**'
      - 'scripts/ci/mutsu-build-lock.sh'
      - 'scripts/ci/test-mutsu-build-lock.sh'
      - 'scripts/ci/verify-mutsu-workflows.sh'
      - 'scripts/verify-hux-traceability.sh'
      - '.gitea/workflows/ui-ci.yml'
  create:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - 'agent-proxy/**'
      - 'scripts/ci/mutsu-build-lock.sh'
      - 'scripts/ci/test-mutsu-build-lock.sh'
      - 'scripts/ci/verify-mutsu-workflows.sh'
      - 'scripts/verify-hux-traceability.sh'
      - '.gitea/workflows/ui-ci.yml'
  workflow_dispatch:
    inputs:
      live_asset_receipt:
        description: 'Run and publish the opt-in live Fortemi asset lifecycle receipt'
        required: false
        default: 'false'
        type: boolean
      live_asset_api_url:
        description: 'Fortemi API base URL for the live asset receipt'
        required: false
        default: 'http://localhost:3000/api/v1'
      live_asset_memory:
        description: 'Isolated Fortemi memory/archive name for the live asset receipt'
        required: false
        default: ''
      live_asset_require_auth:
        description: 'Require bearer-authenticated Fortemi API for the live asset receipt'
        required: false
        default: 'false'
        type: boolean

env:
  GITEA_REGISTRY: git.integrolabs.net
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: fortemi/hotm-ui
  AGENT_PROXY_IMAGE_NAME: fortemi/hotm-agent-proxy

jobs:
  # ─── Always: UI Quality Gate ─────────────────────────────────────
  quality-gate:
    name: UI Quality Gate
    runs-on: node-20
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF:-${GITHUB_SHA:-main}}" ||
            git fetch --depth 1 origin "${GITHUB_SHA:-main}"
          git checkout --detach FETCH_HEAD

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Verify mutsu heavyweight-build lock
        run: |
          scripts/ci/test-mutsu-build-lock.sh
          scripts/ci/verify-mutsu-workflows.sh

      - name: Type check
        working-directory: ui
        run: npm run typecheck

      - name: Run tests with coverage
        working-directory: ui
        run: npm run test:coverage -- --run

      - name: Run realtime convergence suite
        working-directory: ui
        run: npm run test:realtime

      - name: Verify HUX traceability anchors
        working-directory: ui
        run: npm run test:hux-traceability

      - name: Security audit
        working-directory: ui
        run: npm audit --audit-level high

      - name: Generate SBOM
        working-directory: ui
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json

  # ─── Always: Agent Proxy Quality Gate ──────────────────────────────
  agent-proxy-quality-gate:
    name: Agent Proxy Quality Gate
    runs-on: node-20
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF:-${GITHUB_SHA:-main}}" ||
            git fetch --depth 1 origin "${GITHUB_SHA:-main}"
          git checkout --detach FETCH_HEAD

      - name: Install dependencies
        working-directory: agent-proxy
        run: npm ci

      - name: Type check
        working-directory: agent-proxy
        run: npm run typecheck

      - name: Run tests
        working-directory: agent-proxy
        run: npm test

      - name: Security audit (non-blocking)
        working-directory: agent-proxy
        run: npm audit --audit-level high || true

  # ─── Manual: publish live Fortemi browser asset receipt ───────────
  live-asset-receipt:
    name: Live Asset Browser Receipt
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.live_asset_receipt == 'true'
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF:-${GITHUB_SHA:-main}}" ||
            git fetch --depth 1 origin "${GITHUB_SHA:-main}"
          git checkout --detach FETCH_HEAD

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install chromium --with-deps

      - name: Run live asset browser receipt
        id: live_asset
        shell: bash
        working-directory: ui
        env:
          HOTM_LIVE_ASSET_E2E: "1"
          HOTM_LIVE_MEMORY: ${{ inputs.live_asset_memory }}
          HOTM_LIVE_REQUIRE_AUTH: ${{ inputs.live_asset_require_auth }}
          HOTM_API_URL: ${{ inputs.live_asset_api_url }}
          VITE_API_BEARER_TOKEN: ${{ secrets.HOTM_LIVE_ASSET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOTM_LIVE_MEMORY}" ]; then
            echo "live_asset_memory is required when live_asset_receipt=true" >&2
            exit 2
          fi

          mkdir -p test-results/live-asset-receipt
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          npm run test:e2e:live-assets
          status=$?
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          metrics_status=0
          npm run verify:live-asset-metrics || metrics_status=$?
          if [ "${status}" -eq 0 ] && [ "${metrics_status}" -ne 0 ]; then
            status="${metrics_status}"
          fi

          node - "${status}" "${started_at}" "${finished_at}" \
            > test-results/live-asset-receipt/receipt.json <<'NODE'
          const [status, startedAt, finishedAt] = process.argv.slice(2);
          const requireAuth = process.env.HOTM_LIVE_REQUIRE_AUTH === 'true';
          const receipt = {
            receipt: 'hotm-live-asset-browser',
            issue: 'Fortemi/HotM#283',
            command: 'npm run test:e2e:live-assets',
            status: Number(status) === 0 ? 'passed' : 'failed',
            exit_code: Number(status),
            started_at: startedAt,
            finished_at: finishedAt,
            git: {
              repository: process.env.GITHUB_REPOSITORY || null,
              sha: process.env.GITHUB_SHA || null,
              ref: process.env.GITHUB_REF || null,
              run_id: process.env.GITHUB_RUN_ID || null,
            },
            fortemi: {
              api_url: process.env.HOTM_API_URL,
              memory: process.env.HOTM_LIVE_MEMORY,
              require_auth: requireAuth,
              bearer_token_supplied: Boolean(process.env.VITE_API_BEARER_TOKEN),
            },
            metrics_artifact: 'ui/test-results/**/hotm-live-asset-browser-metrics.json',
            scope: [
              'HotM UI setInputFiles multipart upload',
              'browser-origin TUS mismatch, HEAD resume, and finalization',
              'attachment action-menu browser Download saved to test output',
              'browser re-upload to live Fortemi',
              'signed 2.0.0/full-v1 export inspection',
              'clean recovery import and recovered-byte hash verification',
              'browser-boundary timing metrics emitted by the Playwright test',
            ],
            not_claimed: [
              'Tauri desktop GUI native picker or save-open flow',
              'trusted publisher allowlist',
              'direct preview URL bearer coverage',
            ],
          };
          console.log(JSON.stringify(receipt, null, 2));
          NODE

          node scripts/write-receipt-artifact-manifest.cjs \
            test-results/live-asset-receipt/artifact-manifest.json \
            hotm-live-asset-browser-receipt \
            test-results \
            playwright-report
          node scripts/write-receipt-artifact-manifest.cjs --verify \
            test-results/live-asset-receipt/artifact-manifest.json

          exit "${status}"

      - name: Upload live asset browser receipt
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: hotm-live-asset-browser-receipt
          path: |
            ui/test-results/live-asset-receipt/receipt.json
            ui/test-results/live-asset-receipt/artifact-manifest.json
            ui/test-results/
            ui/playwright-report/
          if-no-files-found: warn
          retention-days: 30

  # ─── On push / manual dispatch: Publish dev image ─────────────────
  publish-dev:
    name: Publish Dev Image (Gitea + GHCR)
    runs-on: ubuntu-22.04
    needs: [quality-gate, agent-proxy-quality-gate]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF:-${GITHUB_SHA:-main}}" ||
            git fetch --depth 1 origin "${GITHUB_SHA:-main}"
          git checkout --detach FETCH_HEAD

      - name: Verify vault fetch dependencies
        run: |
          command -v curl
          command -v jq

      - name: Fetch registry tokens from vault
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
          GH_PUBLISH_TOKEN_VAULT_PATH: ${{ vars.GH_PUBLISH_TOKEN_VAULT_PATH }}
          GH_PUBLISH_TOKEN_VAULT_FIELD: ${{ vars.GH_PUBLISH_TOKEN_VAULT_FIELD }}
          BUILD_REPO_TOKEN_VAULT_PATH: ${{ vars.BUILD_REPO_TOKEN_VAULT_PATH }}
          BUILD_REPO_TOKEN_VAULT_FIELD: ${{ vars.BUILD_REPO_TOKEN_VAULT_FIELD }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.registry.spec

      - name: Log in to registries
        run: |
          printf '%s\n' "${BUILD_REPO_TOKEN:?BUILD_REPO_TOKEN is required}" | docker login ${GITEA_REGISTRY} -u ${{ gitea.actor }} --password-stdin
          printf '%s\n' "${GH_PUBLISH_TOKEN:?GH_PUBLISH_TOKEN is required}" | docker login ${GHCR_REGISTRY} -u fortemi --password-stdin

      - name: Build and push agent-proxy dev image
        run: |
          set -euo pipefail
          GITEA_PROXY="${GITEA_REGISTRY}/${AGENT_PROXY_IMAGE_NAME}"
          GHCR_PROXY="${GHCR_REGISTRY}/${AGENT_PROXY_IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Pushing ${image} (attempt ${attempt}/${max_attempts})"
              if docker push "${image}"; then
                return 0
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "Failed to push ${image} after ${max_attempts} attempts"
            return 1
          }

          docker build \
            -f agent-proxy/Dockerfile \
            -t "hotm-agent-proxy:build" \
            agent-proxy

          for image in "${GITEA_PROXY}" "${GHCR_PROXY}"; do
            docker tag "hotm-agent-proxy:build" "${image}:main"
            docker tag "hotm-agent-proxy:build" "${image}:latest"
            docker tag "hotm-agent-proxy:build" "${image}:sha-${SHORT_SHA}"

            push_with_retry "${image}:main"
            push_with_retry "${image}:latest"
            push_with_retry "${image}:sha-${SHORT_SHA}"
          done

          echo "Published agent-proxy dev images:"
          echo "  Gitea:  ${GITEA_PROXY}:main, :latest, :sha-${SHORT_SHA}"
          echo "  GitHub: ${GHCR_PROXY}:main, :latest, :sha-${SHORT_SHA}"

  # =============================================================================
  # Release Jobs (tag push only)
  # =============================================================================

  # ─── Publish agent-proxy release image → Gitea + GHCR ─────────────
  # HotM UI Docker is handled by publish-hotm-ui-image.yml
  publish-release:
    name: Publish Agent-Proxy Release Image
    runs-on: ubuntu-22.04
    needs: [quality-gate, agent-proxy-quality-gate]
    # Gate on both event type AND ref. Gating on ref alone was firing this job
    # on non-tag pushes to main (issue #221) — likely Gitea Actions context
    # bleed from the workflow's mixed push+create triggers. The `on:` block
    # only listens for tag creation via `create: tags: [v*]`, so requiring
    # event_name=='create' is the correct narrow gate.
    if: github.event_name == 'create' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF:-${GITHUB_SHA:-main}}" ||
            git fetch --depth 1 origin "${GITHUB_SHA:-main}"
          git checkout --detach FETCH_HEAD

      - name: Verify vault fetch dependencies
        run: |
          command -v curl
          command -v jq

      - name: Fetch registry tokens from vault
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
          GH_PUBLISH_TOKEN_VAULT_PATH: ${{ vars.GH_PUBLISH_TOKEN_VAULT_PATH }}
          GH_PUBLISH_TOKEN_VAULT_FIELD: ${{ vars.GH_PUBLISH_TOKEN_VAULT_FIELD }}
          BUILD_REPO_TOKEN_VAULT_PATH: ${{ vars.BUILD_REPO_TOKEN_VAULT_PATH }}
          BUILD_REPO_TOKEN_VAULT_FIELD: ${{ vars.BUILD_REPO_TOKEN_VAULT_FIELD }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.registry.spec

      - name: Log in to registries
        run: |
          printf '%s\n' "${BUILD_REPO_TOKEN:?BUILD_REPO_TOKEN is required}" | docker login ${GITEA_REGISTRY} -u ${{ gitea.actor }} --password-stdin
          printf '%s\n' "${GH_PUBLISH_TOKEN:?GH_PUBLISH_TOKEN is required}" | docker login ${GHCR_REGISTRY} -u fortemi --password-stdin

      - name: Build and push agent-proxy release images
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Pushing ${image} (attempt ${attempt}/${max_attempts})"
              if docker push "${image}"; then
                return 0
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "Failed to push ${image} after ${max_attempts} attempts"
            return 1
          }

          echo "Building agent-proxy release images for version: ${VERSION}"

          docker build \
            -f agent-proxy/Dockerfile \
            -t "hotm-agent-proxy:build" \
            agent-proxy

          # Tag and push to Gitea
          GITEA_PROXY="${GITEA_REGISTRY}/${AGENT_PROXY_IMAGE_NAME}"
          docker tag "hotm-agent-proxy:build" "${GITEA_PROXY}:${VERSION}"
          docker tag "hotm-agent-proxy:build" "${GITEA_PROXY}:latest"
          docker tag "hotm-agent-proxy:build" "${GITEA_PROXY}:sha-${SHORT_SHA}"

          push_with_retry "${GITEA_PROXY}:${VERSION}"
          push_with_retry "${GITEA_PROXY}:latest"
          push_with_retry "${GITEA_PROXY}:sha-${SHORT_SHA}"

          # Tag and push to GHCR
          GHCR_PROXY="${GHCR_REGISTRY}/${AGENT_PROXY_IMAGE_NAME}"
          docker tag "hotm-agent-proxy:build" "${GHCR_PROXY}:${VERSION}"
          docker tag "hotm-agent-proxy:build" "${GHCR_PROXY}:latest"
          docker tag "hotm-agent-proxy:build" "${GHCR_PROXY}:sha-${SHORT_SHA}"

          push_with_retry "${GHCR_PROXY}:${VERSION}"
          push_with_retry "${GHCR_PROXY}:latest"
          push_with_retry "${GHCR_PROXY}:sha-${SHORT_SHA}"

          echo "Published agent-proxy release images:"
          echo "  Gitea:  ${GITEA_PROXY}:${VERSION}, :latest, :sha-${SHORT_SHA}"
          echo "  GitHub: ${GHCR_PROXY}:${VERSION}, :latest, :sha-${SHORT_SHA}"
