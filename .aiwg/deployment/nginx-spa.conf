# HotM SPA Nginx Production Configuration
#
# This configuration serves the React SPA and proxies API requests to the matric-memory server.
#
# Related Documentation:
#   - .aiwg/deployment/nginx-security.conf (TLS and security headers)
#   - .aiwg/security/spa-security-config.md
#
# Related Issues: #69 (SPA Deployment)
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/hotm-spa.conf
#   2. Update domain names (hotm.example.com) to your actual domain
#   3. Update matric-memory server endpoint (http://matric-memory:3000)
#   4. For full security setup, merge with nginx-security.conf
#   5. Enable site: ln -s /etc/nginx/sites-available/hotm-spa.conf /etc/nginx/sites-enabled/
#   6. Test and reload: nginx -t && systemctl reload nginx
#
# Architecture:
#   - Frontend: React SPA served from /var/www/hotm/
#   - Backend: matric-memory API server (separate service)
#   - Routing: Client-side React Router handles all non-API routes
#   - Proxy: /api/* requests forwarded to matric-memory server
#

# ============================================================================
# HTTP Server Block - Redirect to HTTPS
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name hotm.example.com www.hotm.example.com;

    # Allow Let's Encrypt HTTP-01 challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# HTTPS Server Block - SPA with API Proxy
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hotm.example.com www.hotm.example.com;

    # ========================================================================
    # SSL/TLS Configuration
    # ========================================================================
    # See nginx-security.conf for complete TLS configuration
    ssl_certificate /etc/letsencrypt/live/hotm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # ========================================================================
    # Security Headers
    # ========================================================================
    # HSTS - Enforce HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Disable legacy XSS filter
    add_header X-XSS-Protection "0" always;

    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy - disable unnecessary browser features
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # Content-Security-Policy
    # NOTE: Update connect-src with your actual matric-memory API endpoint
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://matric-memory.example.com wss://matric-memory.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    # ========================================================================
    # SPA Static File Serving
    # ========================================================================
    # Document root - path to built SPA files (output from npm run build)
    root /var/www/hotm/;
    index index.html;

    # ========================================================================
    # Compression Configuration
    # ========================================================================
    # Enable gzip compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ========================================================================
    # API Proxy to matric-memory Server
    # ========================================================================
    # Forward all /api/* requests to the matric-memory backend
    # This provides same-origin requests and avoids CORS complexity
    location /api/ {
        # IMPORTANT: Update this URL to your actual matric-memory server endpoint
        # Examples:
        #   - Docker Compose service name: http://matric-memory:3000
        #   - Local server: http://127.0.0.1:3000
        #   - Remote server: http://192.168.1.100:3000
        proxy_pass http://matric-memory:3000/api/;

        # HTTP version and headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for API requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings for API responses
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Error handling - return 502 if backend is down
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # ========================================================================
    # SPA Routing - Serve index.html for all non-API routes
    # ========================================================================
    # This enables client-side routing (React Router)
    # All routes are handled by the SPA, which renders the appropriate component
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========================================================================
    # Static Asset Caching
    # ========================================================================
    # Aggressive caching for fingerprinted assets (Vite generates hashed filenames)
    # Cache busting is handled by filename changes, so we can cache immutably
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Preserve critical security headers for static assets
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Cache HTML with shorter duration (allow updates)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ========================================================================
    # Security - Prevent Access to Sensitive Files
    # ========================================================================
    # Deny access to hidden files (e.g., .git, .env, .htaccess)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny access to backup and config files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env)$ {
        deny all;
        return 404;
    }

    # ========================================================================
    # Health Check Endpoint
    # ========================================================================
    # Simple health check for load balancer monitoring
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Error page for backend failures
    location /50x.html {
        root /var/www/hotm/;
        internal;
    }

    # ========================================================================
    # Logging
    # ========================================================================
    access_log /var/log/nginx/hotm-spa-access.log;
    error_log /var/log/nginx/hotm-spa-error.log warn;
}

# ============================================================================
# Deployment Notes
# ============================================================================
#
# 1. Build the SPA:
#    cd ui && npm run build
#
# 2. Deploy built files:
#    rsync -avz ui/dist/ user@server:/var/www/hotm/
#    # OR
#    docker cp ui/dist/. hotm-nginx:/var/www/hotm/
#
# 3. Ensure correct permissions:
#    chown -R www-data:www-data /var/www/hotm
#    chmod -R 755 /var/www/hotm
#
# 4. Update matric-memory endpoint:
#    Edit proxy_pass URL in the /api/ location block above
#
# 5. Test configuration:
#    nginx -t
#
# 6. Reload Nginx:
#    systemctl reload nginx
#
# ============================================================================
# Monitoring and Troubleshooting
# ============================================================================
#
# View access logs:
#   tail -f /var/log/nginx/hotm-spa-access.log
#
# View error logs:
#   tail -f /var/log/nginx/hotm-spa-error.log
#
# Test API proxy:
#   curl -I https://hotm.example.com/api/health
#
# Test SPA routing:
#   curl -I https://hotm.example.com/notes/123
#   # Should return 200 with index.html content
#
# Test static asset caching:
#   curl -I https://hotm.example.com/assets/index-abc123.js
#   # Should have Cache-Control: public, immutable
#
# Test gzip compression:
#   curl -H "Accept-Encoding: gzip" -I https://hotm.example.com/assets/index-abc123.js
#   # Should have Content-Encoding: gzip
#
# ============================================================================
