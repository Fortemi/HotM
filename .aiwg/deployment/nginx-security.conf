# HotM SPA Nginx Security Configuration
#
# This configuration provides production-ready security for the HotM SPA deployment.
#
# Related Documentation:
#   - .aiwg/security/spa-security-config.md
#   - .aiwg/security/migration-security-assessment.md
#
# Related Issues: #47 (CORS), #48 (TLS), #49 (Security Headers)
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/hotm.conf
#   2. Update domain names (hotm.example.com) to your actual domain
#   3. Update API endpoint URLs in CSP connect-src directive
#   4. Obtain Let's Encrypt certificate (see instructions below)
#   5. Enable site: ln -s /etc/nginx/sites-available/hotm.conf /etc/nginx/sites-enabled/
#   6. Test and reload: nginx -t && systemctl reload nginx
#
# Certificate Setup (Let's Encrypt):
#   sudo certbot certonly --standalone -d hotm.example.com --email admin@example.com --agree-tos
#

# ============================================================================
# HTTP Server Block - Redirect to HTTPS
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name hotm.example.com www.hotm.example.com;

    # Allow Let's Encrypt HTTP-01 challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# HTTPS Server Block - Main SPA Configuration
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hotm.example.com www.hotm.example.com;

    # ========================================================================
    # SSL/TLS Configuration (Issue #48)
    # ========================================================================

    # Certificate paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/hotm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotm.example.com/privkey.pem;

    # TLS Version - ONLY TLS 1.2 and 1.3 (disable older insecure versions)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher suites - prioritize forward secrecy and AEAD ciphers
    # TLS 1.3 has built-in secure ciphers, these are for TLS 1.2 compatibility
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Let client choose cipher (TLS 1.3 ignores this setting)
    ssl_prefer_server_ciphers off;

    # SSL session configuration for performance
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling - improves TLS handshake performance
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Optional: Diffie-Hellman parameters for enhanced forward secrecy
    # Generate with: openssl dhparam -out /etc/nginx/dhparam.pem 4096
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # ========================================================================
    # Security Headers (Issue #49)
    # ========================================================================

    # HSTS - Enforce HTTPS for 1 year (includeSubDomains for complete coverage)
    # NOTE: Only enable 'preload' after testing, as it's difficult to undo
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking - deny all framing
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Disable legacy XSS filter - CSP is the modern protection
    add_header X-XSS-Protection "0" always;

    # Control referrer information leakage
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy - disable unnecessary browser features
    # This reduces attack surface by explicitly disabling APIs the SPA doesn't need
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # Content-Security-Policy
    # IMPORTANT: Update connect-src with your actual API and auth endpoints
    #
    # Directive explanations:
    #   default-src 'self'          - Default to same-origin for all resource types
    #   script-src 'self'           - JavaScript only from same origin
    #   style-src 'self' 'unsafe-inline' - CSS from same origin + inline styles (React/CSS-in-JS)
    #   img-src 'self' data: https: - Images from same origin, data URIs, and any HTTPS
    #   font-src 'self' data:       - Fonts from same origin and data URIs
    #   connect-src                 - API endpoints and WebSocket connections
    #   frame-ancestors 'none'      - Prevent embedding in frames (clickjacking)
    #   base-uri 'self'             - Restrict <base> element
    #   form-action 'self'          - Form submissions to same origin only
    #   object-src 'none'           - Block plugins (Flash, Java, etc.)
    #   upgrade-insecure-requests   - Upgrade HTTP requests to HTTPS
    #
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.matric-memory.example.com https://auth.example.com wss://api.matric-memory.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    # ========================================================================
    # SPA Static File Serving
    # ========================================================================

    # Document root - path to built SPA files
    root /var/www/hotm/dist;
    index index.html;

    # SPA routing - serve index.html for all routes (React Router support)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets - aggressive caching for fingerprinted files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Preserve security headers for static assets
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Prevent access to hidden files (e.g., .git, .env)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Prevent access to backup files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        return 404;
    }

    # Health check endpoint for load balancer/monitoring
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # ========================================================================
    # Optional: API Proxy (if hosting API on same domain)
    # ========================================================================
    # Uncomment if you want to proxy API requests through Nginx
    # This avoids CORS issues by making API same-origin
    #
    # location /api/ {
    #     proxy_pass http://127.0.0.1:53211;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    #
    #     # Rate limiting for API (adjust as needed)
    #     # limit_req zone=api_limit burst=20 nodelay;
    # }

    # ========================================================================
    # Logging
    # ========================================================================
    access_log /var/log/nginx/hotm-access.log;
    error_log /var/log/nginx/hotm-error.log warn;
}

# ============================================================================
# Optional: Rate Limiting Configuration
# ============================================================================
# Add to http {} block in /etc/nginx/nginx.conf if rate limiting is needed
#
# # Define rate limit zones
# limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
#
# # Enable rate limit status codes
# limit_req_status 429;

# ============================================================================
# Testing Commands
# ============================================================================
#
# After deployment, verify configuration with these commands:
#
# 1. Test Nginx configuration syntax:
#    nginx -t
#
# 2. Reload Nginx:
#    systemctl reload nginx
#
# 3. Verify TLS configuration:
#    openssl s_client -connect hotm.example.com:443 -tls1_2 </dev/null
#
# 4. Verify security headers:
#    curl -I https://hotm.example.com | grep -iE "^(x-|content-security|strict|referrer|permissions)"
#
# 5. Test TLS 1.0/1.1 rejection:
#    openssl s_client -connect hotm.example.com:443 -tls1 </dev/null 2>&1 | grep -i "handshake"
#
# 6. Online SSL test:
#    https://www.ssllabs.com/ssltest/analyze.html?d=hotm.example.com
#
# 7. Online security headers test:
#    https://securityheaders.com/?q=hotm.example.com
#
# ============================================================================
