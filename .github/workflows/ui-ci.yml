name: React SPA CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-ci.yml'

jobs:
  ui-quality-checks:
    name: React SPA Quality Checks
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd ui
        npm ci

    - name: Type check
      run: |
        cd ui
        npm run typecheck

    - name: Run tests with coverage
      run: |
        cd ui
        npm run test:coverage -- --run

    - name: Security audit (non-blocking)
      run: |
        cd ui
        npm audit --audit-level high || true

    - name: Generate SBOM
      run: |
        cd ui
        npx @cyclonedx/cyclonedx-npm --output-file sbom.json

    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom
        path: ui/sbom.json
        retention-days: 90

  publish-ui-image-internal:
    name: Publish React SPA Image (Internal Registry)
    runs-on: ubuntu-latest
    needs: ui-quality-checks
    if: github.event_name == 'push'
    env:
      GITEA_REGISTRY: git.integrolabs.net
      IMAGE_NAME: ${{ github.repository_owner }}/hotm-ui
      FORTEMI_API_URL: https://memory.integrolabs.net
    steps:
    - name: Checkout source
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        AUTH_REPO_URL="${REPO_URL/https:\/\//https:\/\/x-access-token:${GITHUB_TOKEN}@}"

        if [ ! -d .git ]; then
          git init .
        fi
        git remote remove origin >/dev/null 2>&1 || true
        git remote add origin "${AUTH_REPO_URL}"
        git fetch --depth=1 origin "${GITHUB_SHA}"
        git checkout --force FETCH_HEAD

    - name: Ensure Docker CLI is available
      run: |
        set -euo pipefail
        if command -v docker >/dev/null 2>&1; then
          docker version
          exit 0
        fi

        if command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends docker.io
          docker version
          exit 0
        fi

        echo "Docker CLI is required but could not be installed on this runner image."
        exit 1

    - name: Log in to internal registry
      run: |
        REG_USER="${{ secrets.REGISTRY_USER }}"
        if [ -z "${REG_USER}" ]; then
          REG_USER="${{ github.actor }}"
        fi
        if [ -z "${REG_USER}" ]; then
          REG_USER="fortemi"
        fi
        echo "${{ secrets.BUILD_REPO_TOKEN }}" | docker login "${GITEA_REGISTRY}" -u "${REG_USER}" --password-stdin

    - name: Build and push UI image
      run: |
        set -euo pipefail
        IMAGE="$(echo "${GITEA_REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
        SHORT_SHA="${GITHUB_SHA::7}"
        BRANCH_TAG="${GITHUB_REF_NAME}"

        push_with_retry() {
          local image="$1"
          local max_attempts=3
          local attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Pushing ${image} (attempt ${attempt}/${max_attempts})"
            if docker push "${image}"; then
              return 0
            fi
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
          echo "Failed to push ${image} after ${max_attempts} attempts"
          return 1
        }

        docker build \
          -f ui/Dockerfile \
          --build-arg VITE_API_BASE_URL="${FORTEMI_API_URL}" \
          -t "${IMAGE}:${BRANCH_TAG}" \
          -t "${IMAGE}:sha-${SHORT_SHA}" \
          ui

        push_with_retry "${IMAGE}:${BRANCH_TAG}"
        push_with_retry "${IMAGE}:sha-${SHORT_SHA}"

        if [ "${GITHUB_REF_NAME}" = "main" ]; then
          docker tag "${IMAGE}:${BRANCH_TAG}" "${IMAGE}:latest"
          if ! push_with_retry "${IMAGE}:latest"; then
            echo "Warning: failed to push ${IMAGE}:latest; continuing because branch and sha tags are published."
          fi
        fi
