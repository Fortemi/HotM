name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GITEA_REGISTRY: git.integrolabs.net
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hotm-ui
  FORTEMI_API_URL: https://memory.integrolabs.net

jobs:
  # ─── Gate: typecheck, tests, coverage, audit ────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type check
        working-directory: ui
        run: npm run typecheck

      - name: Run tests with coverage
        working-directory: ui
        run: npm run test:coverage -- --run

      - name: Security audit (non-blocking)
        working-directory: ui
        run: npm audit --audit-level high || true

  # ─── Build: SPA tarball ─────────────────────────────────────────────
  build-spa:
    name: Build SPA
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build React SPA
        working-directory: ui
        run: npm run build

      - name: Create production tarball
        run: tar -czf hotm-spa.tar.gz -C ui/dist .

      - name: Upload SPA artifact
        uses: actions/upload-artifact@v3
        with:
          name: hotm-spa
          path: hotm-spa.tar.gz
          retention-days: 5

  # ─── Build: Docker image → Gitea + GHCR ────────────────────────────
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Extract version and channel from tag
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          if [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            CHANNEL="${BASH_REMATCH[2]}"
          elif [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="$TAG_NAME"
            CHANNEL="stable"
          else
            echo "Error: Invalid tag format. Expected v0.0.0 or v0.0.0-channel"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "Release version: $VERSION (channel: $CHANNEL)"

      - name: Build Docker image
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          docker build \
            -f ui/Dockerfile \
            --build-arg VITE_API_BASE_URL="${FORTEMI_API_URL}" \
            -t "hotm-ui:build" \
            ui

          # Tag for Gitea internal registry
          GITEA_IMAGE="$(echo "${GITEA_REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          docker tag "hotm-ui:build" "${GITEA_IMAGE}:${VERSION}"
          docker tag "hotm-ui:build" "${GITEA_IMAGE}:latest"
          docker tag "hotm-ui:build" "${GITEA_IMAGE}:sha-${SHORT_SHA}"

          # Tag for GHCR public registry
          GHCR_IMAGE="$(echo "${GHCR_REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          docker tag "hotm-ui:build" "${GHCR_IMAGE}:${VERSION}"
          docker tag "hotm-ui:build" "${GHCR_IMAGE}:latest"
          docker tag "hotm-ui:build" "${GHCR_IMAGE}:sha-${SHORT_SHA}"

      - name: Push to Gitea internal registry
        run: |
          set -euo pipefail
          IMAGE="$(echo "${GITEA_REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"

          REG_USER="${{ secrets.REGISTRY_USER }}"
          if [ -z "${REG_USER}" ]; then
            REG_USER="fortemi"
          fi
          echo "${{ secrets.BUILD_REPO_TOKEN }}" | docker login "${GITEA_REGISTRY}" -u "${REG_USER}" --password-stdin

          push_with_retry() {
            local image="$1"
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Pushing ${image} (attempt ${attempt}/${max_attempts})"
              if docker push "${image}"; then
                return 0
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "Failed to push ${image} after ${max_attempts} attempts"
            return 1
          }

          push_with_retry "${IMAGE}:${VERSION}"
          push_with_retry "${IMAGE}:latest"
          push_with_retry "${IMAGE}:sha-${SHORT_SHA}"

      - name: Push to GHCR public registry
        run: |
          set -euo pipefail
          IMAGE="$(echo "${GHCR_REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"

          USERNAME="${{ secrets.REGISTRY_USER }}"
          USERNAME="${USERNAME:-fortemi}"
          echo "${{ secrets.GH_PUBLISH_TOKEN }}" | docker login "${GHCR_REGISTRY}" -u "${USERNAME}" --password-stdin

          push_with_retry() {
            local image="$1"
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Pushing ${image} (attempt ${attempt}/${max_attempts})"
              if docker push "${image}"; then
                return 0
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "Failed to push ${image} after ${max_attempts} attempts"
            return 1
          }

          push_with_retry "${IMAGE}:${VERSION}"
          push_with_retry "${IMAGE}:latest"
          push_with_retry "${IMAGE}:sha-${SHORT_SHA}"

  # ─── Build: Tauri desktop installer (Linux) ──────────────────────────
  # Cross-platform builds (Windows/macOS) via tauri-build-cross.yml on-demand
  build-tauri:
    name: Build Tauri (Linux)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev xdg-utils

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_BUILD_JOBS: "8"
        with:
          projectPath: ui
          tauriScript: npm run tauri

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: tauri-linux
          path: |
            ui/src-tauri/target/release/bundle/**/*.deb
            ui/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn

  # ─── Release: collect all artifacts → GitHub Release ────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-spa, build-docker, build-tauri]
    steps:
      - name: Extract version and channel from tag
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          if [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            CHANNEL="${BASH_REMATCH[2]}"
          elif [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="$TAG_NAME"
            CHANNEL="stable"
          else
            echo "Error: Invalid tag format. Expected v0.0.0 or v0.0.0-channel"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          DISPLAY_VERSION="${VERSION}$([ "$CHANNEL" != "stable" ] && echo "-$CHANNEL" || true)"
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV

      - name: Download SPA artifact
        uses: actions/download-artifact@v3
        with:
          name: hotm-spa
          path: release-assets

      - name: Download Tauri Linux artifacts
        uses: actions/download-artifact@v3
        with:
          name: tauri-linux
          path: release-assets/tauri-linux

      - name: Flatten release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets/flat
          mv release-assets/hotm-spa.tar.gz release-assets/flat/ 2>/dev/null || true
          find release-assets/tauri-linux -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec mv {} release-assets/flat/ \; 2>/dev/null || true
          echo "Release assets:"
          ls -lh release-assets/flat/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HotM ${{ env.DISPLAY_VERSION }}
          draft: false
          prerelease: ${{ env.CHANNEL != 'stable' }}
          files: release-assets/flat/*
          body: |
            ## HotM ${{ env.DISPLAY_VERSION }}

            **Release Channel**: ${{ env.CHANNEL }}

            ### Docker Images

            | Registry | Pull Command |
            |----------|-------------|
            | GHCR (public) | `docker pull ghcr.io/${{ github.repository_owner }}/hotm-ui:${{ env.VERSION }}` |
            | Gitea (internal) | `docker pull git.integrolabs.net/${{ github.repository_owner }}/hotm-ui:${{ env.VERSION }}` |

            ### Desktop Installer (Linux)

            | Format | Description |
            |--------|-------------|
            | `.deb` | Debian/Ubuntu package |
            | `.AppImage` | Portable Linux binary |

            ### SPA Bundle

            Download `hotm-spa.tar.gz` below — extract and serve with any static host (nginx, Apache, S3+CDN).

            ### System Requirements

            - **Web**: Modern browser (Chrome, Firefox, Edge, Safari) + network access to Fortemi API
            - **Desktop**: Linux x86_64 (Ubuntu 22.04+, or any distro via AppImage)
            - **Docker**: Any host running Docker Engine 20+

            ### Links

            - [Documentation](https://github.com/${{ github.repository }}/blob/main/docs/index.md)
            - [Deployment Guide](https://github.com/${{ github.repository }}/blob/main/docs/deployment/)
