name: UI Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release-artifacts:
    name: Release Artifacts and Public Image
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install dependencies
      run: |
        cd ui
        npm ci

    - name: Build React SPA
      run: |
        cd ui
        npm run build

    - name: Create production artifact
      run: |
        cd ui/dist
        tar -czf ../../hotm-spa.tar.gz .

    - name: Extract version and channel from tag
      shell: bash
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/v}
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

        # Extract version and channel (e.g., "0.2.0-beta" -> version="0.2.0", channel="beta")
        if [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
          VERSION="${BASH_REMATCH[1]}"
          CHANNEL="${BASH_REMATCH[2]}"
        elif [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          VERSION="$TAG_NAME"
          CHANNEL="stable"
        else
          echo "Error: Invalid tag format. Expected v0.0.0 or v0.0.0-channel"
          exit 1
        fi

        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
        echo "DISPLAY_VERSION=${VERSION}$([ "$CHANNEL" != "stable" ] && echo "-$CHANNEL")" >> $GITHUB_ENV

        echo "Release version: $VERSION"
        echo "Release channel: $CHANNEL"

    - name: Log in to GHCR
      env:
        GHCR_REGISTRY: ghcr.io
        GHCR_USERNAME: ${{ secrets.REGISTRY_USER }}
      run: |
        USERNAME="${GHCR_USERNAME:-fortemi}"
        echo "${{ secrets.GH_PUBLISH_TOKEN }}" | docker login "${GHCR_REGISTRY}" -u "${USERNAME}" --password-stdin

    - name: Publish UI image to GHCR (public)
      env:
        GHCR_REGISTRY: ghcr.io
        GHCR_IMAGE_NAME: ${{ github.repository_owner }}/hotm-ui
        FORTEMI_API_URL: https://memory.integrolabs.net
      run: |
        set -euo pipefail
        IMAGE="$(echo "${GHCR_REGISTRY}/${GHCR_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
        SHORT_SHA="${GITHUB_SHA::7}"

        push_with_retry() {
          local image="$1"
          local max_attempts=3
          local attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Pushing ${image} (attempt ${attempt}/${max_attempts})"
            if docker push "${image}"; then
              return 0
            fi
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
          echo "Failed to push ${image} after ${max_attempts} attempts"
          return 1
        }

        docker build \
          -f ui/Dockerfile \
          --build-arg VITE_API_BASE_URL="${FORTEMI_API_URL}" \
          -t "${IMAGE}:${VERSION}" \
          -t "${IMAGE}:latest" \
          -t "${IMAGE}:sha-${SHORT_SHA}" \
          ui

        push_with_retry "${IMAGE}:${VERSION}"
        push_with_retry "${IMAGE}:latest"
        push_with_retry "${IMAGE}:sha-${SHORT_SHA}"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        name: HotM SPA ${{ env.DISPLAY_VERSION }}
        body: |
          ## HotM React SPA ${{ env.DISPLAY_VERSION }}

          **Release Channel**: ${{ env.CHANNEL }}

          ### Download

          **React SPA (tar.gz)**: Download `hotm-spa.tar.gz` below
          **Container (GHCR)**: `ghcr.io/${{ github.repository_owner }}/hotm-ui:${{ env.VERSION }}`

          ### Installation

          1. Download the SPA artifact
          2. Extract to your static hosting directory
          3. Configure environment variables for matric-memory API endpoint
          4. Serve the static files with your preferred static host (nginx, Apache, S3+CDN, etc.)

          ### System Requirements

          - Modern web browser (Chrome, Firefox, Edge, Safari)
          - Network access to Fortemi API

          ### Features

          - Local-first notes with immutable originals
          - AI-powered revisions and summarization
          - Hybrid search (full-text + semantic)
          - Automatic link detection
          - React 19 SPA architecture

          For setup instructions, see the [documentation](https://github.com/${{ github.repository }}/blob/main/CLAUDE.md).
        draft: false
        prerelease: ${{ env.CHANNEL != 'stable' }}
        files: hotm-spa.tar.gz
