name: Release

on:
  push:
    tags:
      - 'v*'

env:
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Assets
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        target: x86_64-pc-windows-msvc
    
    - name: Install dependencies
      run: |
        cd ui
        npm ci
    
    - name: Build Tauri app
      run: |
        cd ui
        npm run tauri build
    
    - name: Locate MSI file
      shell: powershell
      run: |
        $msi = Get-ChildItem -Path "ui/src-tauri/target/release/bundle/msi" -Filter "*.msi" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if ($msi) {
          echo "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_ENV
          echo "MSI_NAME=$($msi.Name)" >> $env:GITHUB_ENV
          Write-Output "Found MSI: $($msi.FullName)"
        } else {
          Write-Error "No MSI file found"
          exit 1
        }
    
    - name: Extract version and channel from tag
      shell: bash
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/v}
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
        
        # Extract version and channel (e.g., "0.2.0-beta" -> version="0.2.0", channel="beta")
        if [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
          VERSION="${BASH_REMATCH[1]}"
          CHANNEL="${BASH_REMATCH[2]}"
        elif [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          VERSION="$TAG_NAME"
          CHANNEL="stable"
        else
          echo "Error: Invalid tag format. Expected v0.0.0 or v0.0.0-channel"
          exit 1
        fi
        
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
        echo "DISPLAY_VERSION=${VERSION}$([ "$CHANNEL" != "stable" ] && echo "-$CHANNEL")" >> $GITHUB_ENV
        
        echo "Release version: $VERSION"
        echo "Release channel: $CHANNEL"
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        name: HotM ${{ env.DISPLAY_VERSION }}
        body: |
          ## HotM ${{ env.DISPLAY_VERSION }}
          
          **Release Channel**: ${{ env.CHANNEL }}
          
          ### Download
          
          **Windows (MSI Installer)**: Download `${{ env.MSI_NAME }}` below
          
          ### Installation
          
          1. Download the MSI file
          2. Run the installer as administrator
          3. Follow the installation wizard
          4. HotM will be available in your Start Menu
          
          ### System Requirements
          
          - Windows 10 or Windows 11
          - Microsoft Edge WebView2 Runtime (auto-installed)
          
          ### Features
          
          - Local-first notes with immutable originals
          - AI-powered revisions and summarization (requires Ollama)
          - Hybrid search (full-text + semantic)
          - Automatic link detection
          - Global hotkey: Ctrl+Alt+H
          
          For setup instructions, see the [documentation](https://github.com/${{ github.repository }}/blob/main/CLAUDE.md).
        draft: false
        prerelease: ${{ env.CHANNEL != 'stable' }}
        files: ${{ env.MSI_PATH }}