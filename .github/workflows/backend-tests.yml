name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'

env:
  RUST_BACKTRACE: 1

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: server/target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install PostgreSQL client and SQLx CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        cargo install sqlx-cli --no-default-features --features postgres
        cargo install cargo-audit
    
    - name: Setup test database
      run: |
        cd server
        export DATABASE_URL=postgres://postgres:postgres@localhost:5434/hotm_test
        export DB_PORT=5434
        ./setup_ci_db.sh
        sqlx migrate run --database-url=$DATABASE_URL
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5434/hotm_test
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5434
        DB_PORT: 5433
    
    - name: Run clippy
      run: |
        cd server
        cargo clippy -- -D warnings
    
    - name: Run tests
      run: |
        cd server
        echo "🔧 Starting test execution..."
        echo "Database URL: $DATABASE_URL"
        echo "Test Database URL: $TEST_DATABASE_URL"
        echo ""
        echo "🚀 First, checking if code compiles..."
        SQLX_OFFLINE=true cargo check --all-features || {
          echo "❌ Compilation failed!"
          exit 1
        }
        echo "✅ Code compiles successfully!"
        echo ""
        echo "🚀 Now running tests..."
        cargo test --all-features --verbose || {
          echo "❌ Tests failed!"
          exit 1
        }
        echo "✅ All tests completed successfully!"
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5434/hotm_test
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5434
        USE_MOCK_AI: true
        RUST_LOG: debug
        RUST_BACKTRACE: 1
    
    - name: Check formatting
      run: |
        cd server
        cargo fmt -- --check
    
    - name: Security audit
      run: |
        cd server
        cargo audit