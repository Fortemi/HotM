name: Tauri Desktop Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ui/src-tauri/**'
      - 'ui/src/**'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - '.github/workflows/tauri-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ui/src-tauri/**'
      - 'ui/src/**'
      - 'ui/package.json'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:

jobs:
  build-tauri:
    # CI verification: Linux-only (only runner available on Gitea)
    # Cross-platform builds (Windows/macOS) run in release.yml on tag push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev xdg-utils

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_BUILD_JOBS: "8"
        with:
          projectPath: ui
          tauriScript: npm run tauri

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: tauri-linux
          path: |
            ui/src-tauri/target/release/bundle/**/*.deb
            ui/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
