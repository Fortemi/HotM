name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  RUST_BACKTRACE: 1

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: server/target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install SQLx CLI
      run: cargo install sqlx-cli --no-default-features --features postgres
    
    - name: Setup test database
      run: |
        cd server
        export DATABASE_URL=postgres://postgres:postgres@localhost:5432/hotm_test
        ./setup_ci_db.sh
        sqlx migrate run --database-url=$DATABASE_URL
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotm_test
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432
    
    - name: Run clippy
      run: |
        cd server
        cargo clippy -- -D warnings
    
    - name: Run tests
      run: |
        cd server
        cargo test --all-features
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotm_test
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432
    
    - name: Check formatting
      run: |
        cd server
        cargo fmt -- --check

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
    
    - name: Install dependencies
      run: |
        cd ui
        npm ci
    
    - name: Type check
      run: |
        cd ui
        npm run build
    
    - name: Run tests
      run: |
        cd ui
        npm test -- --run
    
    - name: Generate coverage
      run: |
        cd ui
        npm run test:coverage -- --run

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests]
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Install SQLx CLI
      run: cargo install sqlx-cli --no-default-features --features postgres
    
    - name: Setup test database
      run: |
        cd server
        export DATABASE_URL=postgres://postgres:postgres@localhost:5432/hotm_test
        ./setup_ci_db.sh
        sqlx migrate run --database-url=$DATABASE_URL
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotm_test
    
    - name: Setup Ollama models
      run: |
        # Pull required models
        docker exec ${{ job.services.ollama.id }} ollama pull nomic-embed-text || true
        # Use a smaller model for testing
        docker exec ${{ job.services.ollama.id }} ollama pull tinyllama || true
    
    - name: Start backend server
      run: |
        cd server
        cargo build --release
        nohup cargo run --release &
        sleep 10  # Wait for server to start
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotm_test
        RUST_LOG: hotm_server=info
        OLLAMA_URL: http://localhost:11434
        OLLAMA_GENERATION_MODEL: tinyllama
        OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    
    - name: Run integration tests
      run: |
        cd server
        cargo test --test '*' -- --test-threads=1
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotm_test
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432
        API_URL: http://localhost:53211/api/v1
    
    - name: Check API health
      run: |
        curl -f http://localhost:53211/api/v1/health || exit 1