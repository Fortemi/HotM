name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then break; fi
            sleep 2
          done
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create extension
        run: psql postgresql://postgres:postgres@localhost:5432/hotm_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Run server tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotm_test
        run: |
          cargo test -p hotm-server -- --nocapture

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: ui
        run: npm ci
      - name: Build UI (no Tauri)
        working-directory: ui
        run: npm run build --if-present || npm run typecheck
      - name: Playwright install
        working-directory: ui
        run: npx playwright install --with-deps
      - name: Start server (mock)
        run: |
          # minimal static serve of built UI or start vite dev for tests
          nohup bash -c 'cd ui && npm run start' >/dev/null 2>&1 &
          sleep 3
      - name: Run smoke tests
        working-directory: ui
        run: npm test -- --reporter=list
