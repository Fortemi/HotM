name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: off

jobs:
  server:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Setup test database
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotm_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotm_test
        run: |
          cd server
          sqlx database create --database-url=$DATABASE_URL
          sqlx migrate run --database-url=$DATABASE_URL

      - name: Check code formatting
        run: |
          cd server
          cargo fmt -- --check

      - name: Run clippy
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotm_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotm_test  
        run: |
          cd server
          cargo clippy -- -D warnings

      - name: Run server tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotm_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotm_test
          RUST_LOG: off
        run: |
          cd server
          cargo test -- --nocapture

  ui:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run tests
        working-directory: ui
        run: npm run test -- --run --reporter=verbose

      - name: Type check
        working-directory: ui
        run: npm run typecheck

      - name: Build frontend
        working-directory: ui
        run: npm run build

  security-check:
    name: Security & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Run npm audit
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level moderate
