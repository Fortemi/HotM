name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ui/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ui/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
    
    - name: Install dependencies
      run: |
        cd ui
        npm ci
    
    - name: Type check
      run: |
        cd ui
        npm run build
    
    - name: Run tests
      run: |
        cd ui
        npm test -- --run
    
    - name: Generate coverage
      run: |
        cd ui
        npm run test:coverage -- --run

    - name: Security audit
      run: |
        cd ui
        npm audit --audit-level high