<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c2991;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle glow effect -->
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>
  
  <!-- Glow circle -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)" opacity="0.5"/>
  
  <!-- Brain group -->
  <g id="brain" filter="url(#shadow)">
    <!-- Left hemisphere -->
    <path d="
      M 200 140
      C 150 140, 120 170, 120 220
      C 120 250, 125 280, 140 300
      C 145 340, 160 370, 200 380
      C 230 385, 250 380, 256 360
      L 256 180
      C 256 160, 230 140, 200 140
      Z
    " fill="white" stroke="white" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Right hemisphere -->
    <path d="
      M 312 140
      C 362 140, 392 170, 392 220
      C 392 250, 387 280, 372 300
      C 367 340, 352 370, 312 380
      C 282 385, 262 380, 256 360
      L 256 180
      C 256 160, 282 140, 312 140
      Z
    " fill="white" stroke="white" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Brain stem -->
    <rect x="246" y="360" width="20" height="40" rx="10" fill="white"/>
    
    <!-- Left hemisphere details (gyri and sulci) -->
    <path d="
      M 180 180
      Q 160 200, 170 220
      T 180 260
      M 200 160
      Q 180 180, 190 200
      T 200 240
      M 220 170
      Q 200 190, 210 210
      T 220 250
    " fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Right hemisphere details (gyri and sulci) -->
    <path d="
      M 332 180
      Q 352 200, 342 220
      T 332 260
      M 312 160
      Q 332 180, 322 200
      T 312 240
      M 292 170
      Q 312 190, 302 210
      T 292 250
    " fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Central sulcus -->
    <line x1="256" y1="150" x2="256" y2="360" stroke="#e0e0e0" stroke-width="3" opacity="0.5"/>
    
    <!-- Additional brain folds for detail -->
    <path d="
      M 160 250
      Q 180 260, 200 250
      M 312 250
      Q 332 260, 352 250
      M 180 300
      Q 200 310, 220 300
      M 292 300
      Q 312 310, 332 300
    " fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>