[package]
name = "hotm-ui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.8.0" }

[dependencies]
tauri = { version = "2.8.0", features = ["tray-icon", "global-shortcut", "shell-open"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
