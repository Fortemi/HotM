[package]
name = "hotm-service-manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Windows service management for HotM applications"
license.workspace = true

[[bin]]
name = "hotm-service-manager"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

# HTTP client
reqwest.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# CLI
clap.workspace = true

# Environment
dotenvy.workspace = true

# Configuration
toml.workspace = true

# Async utilities
async-trait.workspace = true
futures.workspace = true

# System integration
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
winapi = { version = "0.3", features = ["winsvc", "winreg", "errhandlingapi", "processthreadsapi", "handleapi", "tlhelp32", "winuser", "winbase", "minwindef"] }

[build-dependencies]
# Windows-specific build dependencies
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
winapi = { version = "0.3", features = ["winnt"] }

[dev-dependencies]
tokio-test.workspace = true