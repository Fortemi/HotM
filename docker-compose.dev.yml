version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg14
    container_name: hotm-postgres-dev
    environment:
      POSTGRES_USER: hotm
      POSTGRES_PASSWORD: hotm_dev_pass
      POSTGRES_DB: hotm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama is running natively on host
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: hotm-ollama-dev
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: