version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hotm_postgres
    environment:
      POSTGRES_USER: roctinam
      POSTGRES_PASSWORD: CN3xJAwfKd
      POSTGRES_DB: hotm_dev
    ports:
      - "5432:5432"
    volumes:
      - hotm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roctinam -d hotm_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hotm_postgres_data: