# HotM Production Docker Compose
#
# What this is: a stateless nginx container serving the HotM React UI, plus a
# small Node agent-proxy. It does NOT include Fortemi, PostgreSQL, or any LLM
# inference. You must run Fortemi separately and point HotM at it via
# FORTEMI_API_URL (which becomes VITE_API_BASE_URL inside the UI build).
#
# HotM is inference-agnostic — Fortemi's inference backend (Ollama, llama.cpp,
# vLLM, any OpenAI-compatible endpoint) is configured entirely on the Fortemi
# side and is invisible to the UI. The OLLAMA_URL env var below is consumed by
# the agent-proxy only, for direct UI-side completions; it is independent of
# whatever inference backend Fortemi itself uses.
#
# See: https://git.integrolabs.net/Fortemi/fortemi#configuration
#
# Usage (pull from GHCR - default):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Usage (build locally):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Environment variables (optional):
#   - HOTM_REGISTRY: Image registry (default: ghcr.io)
#   - VERSION: Image version tag (default: latest)
#   - FORTEMI_API_URL: Fortemi API endpoint (default: http://localhost:3000/api/v1) — REQUIRED for the UI to function
#   - APP_TITLE: Application title (default: HotM)
#   - ANTHROPIC_API_KEY: Anthropic API key (optional, for agent-proxy)
#   - OPENAI_API_KEY: OpenAI API key (optional, for agent-proxy)
#   - OLLAMA_URL: Ollama API URL for agent-proxy direct completions (default: http://localhost:11434).
#                 NOTE: this does not affect Fortemi's inference backend — that's configured on Fortemi.

services:
  hotm-ui:
    image: ${HOTM_REGISTRY:-ghcr.io}/fortemi/hotm-ui:${VERSION:-latest}
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_APP_TITLE: ${APP_TITLE:-HotM}
        VITE_DISABLE_WEBSOCKET: ${VITE_DISABLE_WEBSOCKET:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VITE_API_BASE_URL=${FORTEMI_API_URL:-}
      - VITE_APP_TITLE=${APP_TITLE:-}
      - FORTEMI_API_URL=${FORTEMI_API_URL:-http://host.docker.internal:3000/api/v1}
    container_name: hotm-ui
    restart: unless-stopped
    ports:
      - "4180:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - hotm-network
    labels:
      - "com.hotm.service=ui"
      - "com.hotm.description=HotM React SPA"

  agent-proxy:
    image: ${HOTM_REGISTRY:-ghcr.io}/fortemi/hotm-agent-proxy:${VERSION:-latest}
    build:
      context: ./agent-proxy
      dockerfile: Dockerfile
    container_name: hotm-agent-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FORTEMI_API_URL=${FORTEMI_API_URL:-http://host.docker.internal:3000/api/v1}
      - OLLAMA_URL=http://host.docker.internal:11434
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ORIGIN=*
      - PORT=3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - hotm-network
    labels:
      - "com.hotm.service=agent-proxy"
      - "com.hotm.description=AI agent proxy for provider routing"

networks:
  hotm-network:
    driver: bridge
