# HotM all-in-one Docker deployment
#
# The default image contains the HotM React UI plus the digest-pinned Fortemi
# PostgreSQL/API/MCP bundle. It is intended for a local or private host and
# publishes loopback ports only. Set POSTGRES_PASSWORD in .env before startup.
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# The legacy UI-only image remains available as ghcr.io/fortemi/hotm-ui, but it
# is not the supported default for a self-contained HotM deployment.

services:
  hotm:
    image: ${HOTM_REGISTRY:-ghcr.io}/fortemi/hotm-bundle:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/bundle/Dockerfile
      args:
        VERSION: ${VERSION:-local}
        GIT_SHA: ${GIT_SHA:-local}
        BUILD_DATE: ${BUILD_DATE:-local}
    container_name: hotm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      I_UNDERSTAND_NO_AUTH: ${I_UNDERSTAND_NO_AUTH:-true}
      MATRIC_ATTACHMENT_SCAN_MODE: ${MATRIC_ATTACHMENT_SCAN_MODE:-disabled}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
      OLLAMA_BASE: ${OLLAMA_BASE:-http://host.docker.internal:11434}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://host.docker.internal:8000/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${HOTM_UI_PORT:-4180}:4180"
      - "127.0.0.1:${FORTEMI_API_PORT:-3000}:3000"
      - "127.0.0.1:${FORTEMI_MCP_PORT:-3001}:3001"
    volumes:
      - hotm-postgres:/var/lib/postgresql/data
      - hotm-files:/var/lib/matric/files
      - hotm-backups:/var/backups/matric-memory
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:4180/healthz >/dev/null && curl -fsS http://127.0.0.1:3000/livez >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - hotm-network
    labels:
      - "com.hotm.service=bundle"
      - "com.hotm.description=HotM UI plus pinned Fortemi runtime"

  agent-proxy:
    image: ${HOTM_REGISTRY:-ghcr.io}/fortemi/hotm-agent-proxy:${VERSION:-latest}
    build:
      context: ./agent-proxy
      dockerfile: Dockerfile
    container_name: hotm-agent-proxy
    restart: unless-stopped
    depends_on:
      hotm:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FORTEMI_API_URL: http://hotm:3000/api/v1
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4180}
      PORT: 3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - hotm-network
    labels:
      - "com.hotm.service=agent-proxy"
      - "com.hotm.description=AI agent proxy for provider routing"

volumes:
  hotm-postgres:
  hotm-files:
  hotm-backups:

networks:
  hotm-network:
    driver: bridge
